he system. I subsequently disabled or deleted these accounts. Further, I took a deep dive into our overall user account management process to prevent similar oversights in the future."}]},{"n":53,"q":"Can you define Life Cycle Manager (LCM)?","b":[{"t":"p","x":"SailPoint’s LCM provides a comprehensive solution for managing the entire identity lifecycle, from onboarding to offboarding, in a user-friendly, automated, and policy- driven manner. It integrates identity governance, access request, automated provisioning, and password management into a single, unified solution. Here are the key components of LCM:"},{"t":"li","x":"• Joiner: When a new employee joins the company, LCM automates the process of providing the appropriate access rights. It uses role-based access control (RBAC) and access policies to determine which rights the new employee should have, based on their role, department, location, etc."},{"t":"li","x":"• Mover: When an employee changes roles within the organization, LCM handles the process of updating their access rights. It can remove access rights that are no longer needed and provide new ones that are required for the new role."},{"t":"li","x":"• Certifications and Audits: LCM supports the process of periodically reviewing and certifying access rights. This can help the organization stay compliant with various regulations and maintain a strong security posture."},{"t":"li","x":"• Leaver: When an employee leaves the company, LCM automates the process of revoking their access rights. This helps minimize the risk of unauthorized access."},{"t":"li","x":"• Self-Service and Delegated Administration: LCM provides a self-service portal where users can request additional access, manage their own passwords, etc. It also supports delegated administration, allowing managers or department heads to handle access requests for their teams."},{"t":"li","x":"• Provisioning and Deprovisioning: With integration to various IT resources, LCM can automatically provision and deprovision access on various systems and applications, reducing the manual workload on the IT team."}]},{"n":54,"q":"When Joiner Mover Leaver (JML) events are triggered, what happens to HRMS?","b":[{"t":"p","x":"In the context of an IGA system such as SailPoint IdentityIQ, Joiner Mover Leaver (JML) processes refer to the lifecycle events of users in an organization."},{"t":"li","x":"• Joiners are new employees who are joining the organization."},{"t":"li","x":"• Movers are existing employees who are changing roles within the organization."},{"t":"li","x":"• Leavers are employees who are leaving the organization. These JML events often trigger updates in both the Human Resource Management System (HRMS) and the IGA system, like IdentityIQ, because changes in an employee’s status or role typically require changes in their access rights. So when a JML event is triggered:"},{"t":"li","x":"1. For a Joiner, a new record is created in the HRMS database reflecting the details of the new employee. This record includes all the necessary attributes like name, department, role, manager, etc."},{"t":"li","x":"2. For a Mover, the existing employee’s record in the HRMS database is updated to reflect the change in their role, department, manager, location, etc."},{"t":"li","x":"3. For a Leaver, the employee’s record is typically updated in the HRMS to indicate their departure. Depending on the organization’s policy, the record might later be archived or deleted."},{"t":"p","x":"Once these changes are reflected in the HRMS, they also need to be reflected in the IGA system to ensure that the employees’ access rights are appropriately adjusted. This is typically done by a process known as reconciliation or aggregation, where the IGA system periodically synchronizes with the HRMS database to detect any changes and adjust access rights accordingly."},{"t":"p","x":"For example, when a new joiner record is detected in the HRMS database, the IGA system would initiate the onboarding process, provisioning the new user with the access rights appropriate for their role. For a mover, the system would adjust their access rights according to their new role, possibly revoking some access and granting other access. And for a leaver, the system would initiate the offboarding process, revoking all their access to prevent any potential security risks."}]},{"n":55,"q":"Provide additional details on how JML events are triggered and executed in SailPoint IIQ?","b":[{"t":"p","x":"A JML event is typically triggered based on changes in the HRMS (Human Resource Management System) database. The HRMS database contains the data about employees, including their roles, departments, employment status, etc. When an employee joins the company, changes roles, or leaves the company, this information is updated in the HRMS database. Here’s a more detailed look at how these events are triggered and what happens:"},{"t":"li","x":"1. Joiner: When a new employee is added to the HRMS database, a Joiner event is triggered. The IAM system (like SailPoint IIQ) receives this event, typically through an automated process like a scheduled import or via a real- time API call. Then, based on the new employee’s role, department, and other attributes, the IAM system determines which access rights the employee should have, and provisions these access rights on the various IT systems and applications that the employee needs to use."},{"t":"li","x":"2. Mover: When an employee’s role, department, or other attribute changes in the HRMS database, a Mover event is triggered. The IAM system receives this event and re- evaluates the employee’s access rights. It may revoke some access rights that are no longer appropriate, and provision new ones that are required for the new role or department."},{"t":"li","x":"3. Leaver: When an employee is marked as having left the company in the HRMS database, a Leaver event is triggered. The IAM system receives this event and revokes all the access rights associated with the employee, ensuring that they can no longer access the company’s IT systems and applications."},{"t":"p","x":"These JML events help automate the management of access rights, ensuring that each employee always has the appropriate access. They also help improve security by ensuring that access is revoked promptly when an employee leaves the company. Additionally, by automating these processes, the JML events help reduce the workload on the IT department and reduce the risk of human error."}]},{"n":56,"q":"Services Standard Deployment SSD (SSB in version 7) in SailPoint IIQ","b":[{"t":"li","x":"1. Services: This typically refers to the various functionalities offered by SailPoint IIQ, such as access certification, password management, identity lifecycle management, etc."},{"t":"li","x":"2. Standard: This might indicate the use of out-of-the-box IIQ features and functionalities without heavy customization. A standard deployment would aim to use the core capabilities of IIQ, modifying configurations as necessary but avoiding significant code alterations."},{"t":"li","x":"3. Deployment: This refers to the process of setting up and configuring IIQ within an organization’s IT environment. This can involve tasks like setting up the IIQ server, integrating IIQ with other IT systems (like HR systems, databases, or directory services), configuring IIQ functionalities, and testing the setup."},{"t":"p","x":"So “Services Standard Deployment” could refer to the process of deploying IIQ’s services in an organization’s IT environment using standard, out-of-the-box configurations and settings. It’s always recommended to verify this with the source or context where the term is being used, as terminologies and meanings can vary based on specific organizational or project contexts."},{"t":"p","x":"In non-IT terms, Services Standard Deployment (SSD) in IIQ can be thought of like a prebuilt recipe for setting up IIQ. It provides a common starting point that ensures a baseline level of functionality for managing user access and identities."},{"t":"p","x":"Imagine you’re building a house. The standard building code defines the basic structure, safety features, and essential elements like walls and a roof. This is like the baseline functionality provided by SSD in IIQ. Here’s a breakdown:"},{"t":"li","x":"• Services: These are the core functionalities of IIQ, like managing user access requests, provisioning accounts, and reviewing user access."},{"t":"li","x":"• Standard Deployment: This refers to a pre-configured way of setting up these functionalities. It’s like having a pre-designed house plan that outlines where the rooms, doors, and windows go."}]},{"n":57,"q":"Have you worked on SailPoint ISC?","b":[{"t":"p","x":"Yes. In my previous role at Meridian, I had the opportunity to work on a significant project on SailPoint ISC."}]},{"n":58,"q":"What are the differences between SailPoint IIQ and SP ISC?","b":[{"t":"li","x":"• SailPoint Identity Security Cloud (SP ISC): ISC is a cloud-based identity management solution offered by SailPoint. It allows organizations to manage user identities and access rights securely in the cloud. One of the key advantages of ISC is its flexibility and scalability, as it leverages cloud infrastructure, making it easier to adapt to changing business needs and handle varying user loads."},{"t":"li","x":"• SailPoint IIQ: On the other hand, IIQ is an on-premises identity management solution from SailPoint. Unlike ISC, which is hosted in the cloud, IIQ is installed and maintained locally on the organization’s servers. IIQ offers more customization options, allowing organizations to tailor the solution to their specific requirements. However, this may also mean that the deployment and maintenance of IIQ can be more involved and time-consuming compared to ISC’s cloud-based deployment."},{"t":"li","x":"• Differences: The primary differences between IIQ and ISC lie in their deployment models and the level of customization they offer. ISC, being a cloud-based solution, offers greater ease of deployment and scalability compared to the on-premises IIQ. IIQ, on the other hand, provides more granular control and customization options, which may be desirable for organizations with highly specific or complex identity management requirements."},{"t":"li","x":"• Experience with SP ISC: In my experience working with ISC, I’ve found it to be a robust and efficient cloud-based identity management solution. Its SaaS nature makes it relatively quick to deploy and easy to manage. The cloud infrastructure also ensures automatic updates and maintenance, reducing the burden on the organization’s IT team."},{"t":"li","x":"• I’ve also noticed that the choice between IIQ and ISC heavily depends on the organization’s unique needs and context. For organizations with straightforward identity management requirements and a preference for cloud- based solutions, ISC proves to be an excellent choice. On the other hand, if an organization requires extensive customization and has strict compliance or security considerations that demand an on-premises solution, IIQ might be the better fit."}]},{"n":59,"q":"Provide me steps on how you migrate to SailPoint Identity Security Cloud?","b":[{"t":"li","x":"• Assessment and Planning: First, understand and compare the IIQ and ISC systems, and plan the migration process with the scope, timeline, and risks in mind."},{"t":"li","x":"• Data Backup and Preparation: Then perform a full data backup from IIQ, ensure data integrity, and prepare for the migration."},{"t":"li","x":"• Infrastructure Setup: Set up the necessary infrastructure for ISC, including servers and databases."},{"t":"li","x":"• Data Migration: Transfer the data from IIQ to ISC using scripts or migration tools, and verify data integrity."},{"t":"li","x":"• Application Migration: Migrate the custom applications and integrations from IIQ to ISC while preserving functionality."},{"t":"li","x":"• Testing: Conduct comprehensive testing to resolve any issues, including functionality, regression, and performance testing."},{"t":"li","x":"• User Training and Documentation: Train the users on ISC usage, and provide detailed documentation for effective navigation."},{"t":"li","x":"• Rollout and Monitoring: Gradually roll out ISC to the users, and monitor the system closely for post-migration issues."},{"t":"li","x":"• Post-Migration Support: And finally, offer ongoing support to address user questions and ensure system stability."}]},{"n":60,"q":"How do you cope or deal with timelines on implementing SailPoint-specific tasks?","b":[{"t":"li","x":"1. Understand the Scope and Requirements: First, I clearly define the project scope — knowing what applications and systems need to be integrated, the specific functionalities to be implemented (like provisioning, compliance management, etc.), and the compliance requirements. And I gather detailed requirements, making sure I have a comprehensive understanding of the technical and business requirements before planning the implementation timeline."},{"t":"li","x":"2. Plan and Prioritize: Then I create a detailed project plan, breaking the project down into manageable tasks and sub- tasks, and use project management tools to outline these tasks along with their dependencies. I prioritize the critical tasks that could impact the timeline if delayed, and I consider the Pareto principle (80/20 rule) to focus on the tasks that will have the most significant impact."},{"t":"li","x":"3. Set Realistic Timelines: I estimate time realistically, using historical data if available and consulting with team members to set realistic timelines for each task. And I always include buffer time for unexpected delays or issues, especially for complex tasks or those dependent on external factors."},{"t":"li","x":"4. Use Agile Methodologies: Implementing SailPoint can benefit from an agile approach, which allows for flexibility, regular feedback, and iterative development. So I divide the project into sprints, with each sprint delivering a piece of the functionality, allowing for adjustments as the project progresses."},{"t":"li","x":"5. Communicate Effectively: I keep all the stakeholders informed with regular updates on progress, challenges, and changes in timelines, and I engage them throughout the project to ensure their requirements are met and to manage their expectations."},{"t":"li","x":"6. Monitor and Adjust: I regularly monitor the progress against the plan and adjust the timelines as necessary. For risk management, I identify potential risks early and have contingency plans in place to mitigate them without significantly affecting the timeline."},{"t":"li","x":"7. Leverage Expertise: I rely on team members with SailPoint experience, or consider bringing in consultants for the critical aspects of the project, to ensure the tasks are completed efficiently. And I invest in training and knowledge sharing for the team to build internal competencies, which helps with smoother implementation and troubleshooting."},{"t":"li","x":"8. Automation and Integration Tools: I automate repetitive tasks where possible to speed up implementation tasks, such as data migration or report generation, and I leverage the integration tools and APIs provided by SailPoint for connecting with other systems, which saves time and effort."},{"t":"li","x":"9. Quality Assurance: I implement a robust testing strategy to catch and resolve issues early, reducing the risk of delays closer to the deployment date, and I create feedback loops for rapid feedback during the testing phases to quickly address any concerns or bugs."},{"t":"li","x":"10. Manage Change Effectively: And finally, I prepare for and manage the human aspect of change, including training for users and administrators, to ensure a smooth transition to the new system."}]},{"n":61,"q":"Are you proficient in Java? Which IDE tools have you used?","b":[{"t":"p","x":"While my primary expertise is not in Java, I have a foundational understanding of it, which helps me navigate and configure identity management solutions like SailPoint effectively. My experience has involved leveraging Java- based configurations and understanding the basic logic behind the customizations in SailPoint."}]},{"n":62,"q":"Difference between Java and BeanShell?","b":[{"t":"p","x":"In the context of SailPoint, Java is the core programming language used for creating more complex customizations and integrations. BeanShell, on the other hand, is used within SailPoint for scripting. It allows for executing Java- like scripts directly without the need for compilation, making it useful for quick tweaks or configurations. So essentially, Java offers the structure and depth needed for developing robust solutions, while BeanShell provides the flexibility for on-the-fly script execution within the SailPoint environment."}]},{"n":63,"q":"Which IDE tools have you used?","b":[{"t":"p","x":"I’m familiar with JetBrains’ IntelliJ IDEA, and I’ve used the Community Edition."}]},{"n":65,"q":"Can you explain the concept of identity governance and its significance in Identity Security Cloud?","b":[{"t":"p","x":"Identity governance involves managing user access rights to ensure the right people have the right access at the right time. In Identity Security Cloud, it’s the foundation for automating provisioning, enforcing compliance, managing roles, and auditing user activity."}]},{"n":66,"q":"What are the key components of the Identity Security Cloud?","b":[{"t":"p","x":"The key components include Identity Security Cloud itself, IdentityAI (for analytics), cloud governance, non- employee risk management, and integrations with other SaaS and on-prem systems."}]},{"n":67,"q":"How do you onboard an application into Identity Security Cloud?","b":[{"t":"p","x":"You onboard applications using out-of-the-box connectors or custom connectors. The process includes defining the source configuration, attribute mapping, and setting up account aggregation, provisioning, and access request capabilities."},{"t":"p","x":"Example: On my Meridian project, I onboarded Workday using the Web Services connector. We mapped employee attributes like employeeID, jobTitle, and department, and enabled birthright provisioning based on roles."}]},{"n":68,"q":"What is the process for creating and managing identity profiles?","b":[{"t":"p","x":"Identity profiles are created to define how identities are correlated, transformed, and classified. You map the attributes from the authoritative sources, define the identity lifecycle states, and assign the provisioning policies based on roles or attributes."},{"t":"p","x":"Example: On my Meridian project, we built an identity profile that pulled from Oracle HCM and used jobCode and region to assign application access."}]},{"n":69,"q":"How is multi-factor authentication configured in Identity Security Cloud?","b":[{"t":"p","x":"MFA is typically enforced via integration with IdPs like Okta or Azure AD. Identity Security Cloud leverages these platforms to challenge users during login or sensitive actions."},{"t":"p","x":"Example: On my Meridian project, we integrated Identity Security Cloud with Okta to enforce MFA for any identity accessing the Request Center."}]},{"n":70,"q":"Can you describe the steps to manage virtual appliances within Identity Security Cloud?","b":[{"t":"p","x":"Virtual appliances act as bridges for on-prem connectivity. The steps include downloading the OVA, deploying it on a hypervisor, registering it with Identity Security Cloud, and configuring it for the specific connectors."},{"t":"p","x":"Example: We deployed two virtual appliances in HA mode for the AD and SAP connectors, ensuring redundancy and faster job execution."}]},{"n":71,"q":"What are the different lifecycle states in Identity Security Cloud, and how are they managed?","b":[{"t":"p","x":"Typical states include onboarding, active, inactive, and terminated. These are managed using lifecycle events triggered by attribute changes or external events from the HR systems."},{"t":"p","x":"Example: When a Workday feed set a terminationDate, Identity Security Cloud automatically triggered the “terminated” lifecycle state and deprovisioned the access."}]},{"n":72,"q":"How does Identity Security Cloud handle automated provisioning and deprovisioning?","b":[{"t":"p","x":"Through policies and lifecycle events, Identity Security Cloud provisions or deprovisions accounts based on role assignments, changes in user attributes, or termination signals from the authoritative sources."},{"t":"p","x":"Example: A new hire in Salesforce Sales Ops automatically received Salesforce and AD access based on location and department."}]},{"n":73,"q":"What is the role of lifecycle events in managing user access?","b":[{"t":"p","x":"Lifecycle events help automate transitions like hire, transfer, or termination. They trigger the provisioning workflows to assign or remove access based on the rules defined in the identity profile."},{"t":"p","x":"Example: When a user transferred to a new region, a lifecycle event triggered the deprovisioning of the old regional systems and the provisioning of the new ones."}]},{"n":74,"q":"How are access requests managed and approved in Identity Security Cloud?","b":[{"t":"p","x":"Users request access through the Request Center. Approvals are routed based on the configured policies, such as manager, application owner, or role-based approvers."},{"t":"p","x":"Example: For elevated access requests, we configured multi-level approvals including InfoSec and the user’s director."}]},{"n":75,"q":"Can you explain the process of setting up and managing certification campaigns?","b":[{"t":"p","x":"You define the scope (users, roles, access), schedule the campaign, assign the reviewers, and enforce remediation based on the certification outcomes. Identity Security Cloud supports manager, role, and application certifications."},{"t":"p","x":"Example: We ran quarterly manager certifications, and any unreviewed access was auto-revoked after 10 days."}]},{"n":77,"q":"How does Identity Security Cloud facilitate compliance reporting and auditing?","b":[{"t":"p","x":"It provides out-of-the-box reports and audit logs, tracks all access and changes, and allows the export of certification decisions and provisioning activities for audit."},{"t":"p","x":"Example: We exported quarterly access certification reports for SOX compliance during the internal audit reviews."}]},{"n":78,"q":"What tools are available in Identity Security Cloud for identity analytics and risk assessment?","b":[{"t":"p","x":"IdentityAI enables advanced analytics, spotting high-risk users, access anomalies, and policy violations using machine learning and behavior patterns."},{"t":"p","x":"Example: IdentityAI flagged a user who gained access to multiple finance systems outside of their role norms, triggering an investigation."}]},{"n":79,"q":"How are machine identities managed within Identity Security Cloud?","b":[{"t":"p","x":"Machine identities are onboarded as non-human accounts, managed through account aggregation and provisioning policies, and included in the access reviews."},{"t":"p","x":"Example: We onboarded service accounts with tags like isServiceAccount=true, and assigned application owners for periodic review."}]},{"n":80,"q":"What steps would you take to troubleshoot a failed provisioning task?","b":[{"t":"p","x":"First, I check the provisioning task result, then view the debug logs, verify the connector and account mappings, test the credentials, and ensure the target system is available. Then I retry after resolving the root cause."},{"t":"p","x":"Example: We had a failed AD provisioning job due to an expired service account password. Rotating the credential and testing connectivity resolved the issue."}]},{"n":81,"q":"How do you manage and monitor API keys and tokens in Identity Security Cloud?","b":[{"t":"p","x":"API keys are created through the Admin UI under the API section. They should be stored securely and rotated regularly. Monitoring includes reviewing the API usage logs."},{"t":"p","x":"Example: For a custom ServiceNow integration, we generated an API key with the least privilege, scoped to only the access-request endpoints."}]},{"n":82,"q":"How does Identity Security Cloud integrate with external systems and applications?","b":[{"t":"p","x":"It uses connectors (e.g., SCIM, Web Services, JDBC) or APIs to integrate with external apps. You define the schema, the provisioning logic, and the sync schedules per application."},{"t":"p","x":"Example: We integrated Oracle HCM using the Web Services connector and scheduled nightly sync jobs for updates."}]},{"n":83,"q":"What are the methods for extending Identity Security Cloud’s functionality through APIs or connectors?","b":[{"t":"p","x":"You can use the Identity Security Cloud REST APIs for integrations, custom workflows, or app provisioning. Custom connectors can be built using ISC’s Web Services or SCIM connector frameworks."},{"t":"p","x":"Example: We built a custom connector using the Web Services framework to provision users into a legacy document management system."}]},{"n":84,"q":"Where do you document the SailPoint IIQ processes and procedures?","b":[{"t":"p","x":"I document all the SailPoint IIQ tasks on Confluence. First, I set up a dedicated space named “SailPoint IIQ Implementation.” Within this space, I created distinct pages for each primary task associated with IIQ, such as “Identity Aggregation,” “Access Review,” “Role Management,” and so on. Each page details the objective, the steps, and the best practices related to the respective task."},{"t":"p","x":"To ensure clarity, I included visual aids like flowcharts and screenshots wherever necessary. These visual components highlight the IIQ user interface, helping team members correlate the documentation with the actual software."},{"t":"p","x":"For tasks that involve multiple steps or subtasks, I used Confluence’s collapsible content macro, allowing readers to expand sections as required. This keeps the documentation concise, enabling users to quickly find the information they’re looking for."},{"t":"p","x":"Additionally, I added a “Troubleshooting” section to each page, listing the common issues faced during each task and their resolutions."},{"t":"p","x":"On the main page of the “SailPoint IIQ Implementation” space, I incorporated an index linking to all the individual task pages. This table of contents gives users a holistic view and easy navigation to specific tasks."},{"t":"p","x":"Finally, to foster collaboration, I embedded a comments section at the bottom of every page. This allows team members to ask questions, provide additional insights, or suggest revisions."},{"t":"p","x":"And over time, as tasks evolved or new tasks were introduced in IIQ, I made sure the Confluence documentation was promptly updated, maintaining its relevance and utility."}]},{"n":85,"q":"How did you pick or select your daily tasks from the Jira board?","b":[{"t":"p","x":"In determining my daily tasks for SailPoint projects, I primarily use JIRA, a widely used project management tool that offers a visual board for task tracking."},{"t":"p","x":"Each morning, I start by opening my JIRA board dedicated to SailPoint-specific tasks. The board, typically structured in a Kanban or Scrum format, is populated with tasks categorized into different columns like “Backlog,” “In Progress,” and “Done.” Each task (or “story”) on the board represents a specific work item related to the SailPoint implementation or support, and is tagged with essential metadata like priority, assignee, and estimated completion time. I follow these steps to pick my tasks:"},{"t":"li","x":"1. Review Priorities: First, I review any high-priority or urgent tasks. These are often highlighted or tagged with labels like “Critical” or “Urgent” and may be related to production issues, key milestones, or client demands."},{"t":"li","x":"2. Check Due Dates: Some tasks have strict deadlines. I filter the tasks that are due in the next few days to ensure timely completion."},{"t":"li","x":"3. Progress on Ongoing Tasks: Before taking up new tasks, I assess the status of the tasks already “In Progress.” If any are close to completion, I focus on finishing them to keep the workflow moving smoothly."},{"t":"li","x":"4. Collaborate with the Team: Sometimes tasks require collaboration. I reach out to team members to align on the joint tasks, ensuring that we’re not blocking each other and that tasks are being handled efficiently."},{"t":"li","x":"5. Pull from the Backlog: After addressing the high-priority and ongoing tasks, I pull new tasks from the “Backlog” column, starting with those that have been prioritized or earmarked for the current sprint or cycle."},{"t":"p","x":"This daily ritual helps me stay organized, ensures that critical tasks don’t fall through the cracks, and allows me to provide stakeholders with timely updates on SailPoint-related activities."}]},{"n":86,"q":"Custom connectors and workflows","b":[{"t":"p","x":"I don’t usually write scripts from scratch. I modify and configure the ready ones."}]},{"n":null,"q":"Applying a patch in SailPoint IIQ","b":[{"t":"p","x":"Applying a patch in SailPoint IIQ is a crucial step in maintaining the integrity and performance of your system, as patches often contain important security updates, bug fixes, and enhancements. The specific process can vary depending on the system architecture and operational policies, but here are the general steps I follow to apply a patch in IIQ:"},{"t":"li","x":"1. Backup: Before I apply a patch, it’s crucial to back up the system. This includes the database, configuration files, and custom files."},{"t":"li","x":"2. Download the Patch: Patches for IIQ are typically provided by SailPoint in a downloadable file format. They are usually available on the SailPoint customer support website. I download the appropriate patch based on the current IIQ version."},{"t":"li","x":"3. Inspect the Patch Notes: Then I review the patch notes provided by SailPoint. They often include important information about what the patch does, what issues it addresses, and any potential side effects or requirements."},{"t":"li","x":"4. Test the Patch: It’s good practice to first apply the patch in a test or development environment before deploying it in the production environment. This allows me to identify and resolve any potential issues without impacting the production system."},{"t":"li","x":"5. Apply the Patch: To apply the patch, I generally need to stop the IIQ application, move the patch files to the appropriate directories, and then restart the application. The specific process can depend on the patch and the system configuration."},{"t":"li","x":"6. Verify the Patch: After the patch has been applied, I verify that it has been successfully installed. This could involve checking the system logs, version numbers, or using the features addressed by the patch."},{"t":"li","x":"7. Document the Patch: And finally, I document all the changes, including the patch applied, the date, the reason for the patch, and any issues encountered during the process."}]},{"n":null,"q":"Upgrading SailPoint IIQ","b":[{"t":"p","x":"Upgrading SailPoint IIQ involves a sequence of steps that ensure a smooth transition from an older version to a newer one. Here’s a broad overview of the upgrade process:"},{"t":"li","x":"1. Backup: Before beginning the upgrade process, it’s crucial to back up all the relevant data, including the database, custom files, configurations, etc. This allows you to restore the system to its previous state in case something goes wrong during the upgrade."},{"t":"li","x":"2. Understand the Changes: Then review the product release notes and documentation for the new version. This will help you understand what changes, enhancements, or deprecations are included in the upgrade."},{"t":"li","x":"3. Test the Upgrade in a Non-production Environment: It’s a best practice to test the upgrade process in a development or staging environment before deploying it to the production environment. This allows you to identify any potential issues or conflicts in a controlled setting."},{"t":"li","x":"4. Prepare for the Upgrade: This involves steps such as disabling scheduled tasks, informing users about the scheduled downtime, and making sure you have all the necessary software and hardware resources to carry out the upgrade."},{"t":"li","x":"5. Execute the Upgrade: Start the upgrade process as per the instructions provided by SailPoint. This typically involves installing the new software, migrating the data, and running scripts to update the database schema, among other tasks."},{"t":"li","x":"6. Validate the Upgrade: Once the upgrade is complete, validate the installation by running tests to ensure everything is functioning as expected. Check whether all the data is intact and whether all the workflows, connectors, and customizations are working properly."},{"t":"li","x":"7. Post-Upgrade Tasks: These might include re-enabling scheduled tasks, updating configurations, and performing any necessary remediation tasks that were identified during the validation process."},{"t":"li","x":"8. Communicate the Upgrade: Once everything has been verified and the system is stable, inform your users that the upgrade is complete and the system is back online."},{"t":"p","x":"It’s crucial to plan and manage the upgrade process carefully to ensure minimal disruption to the organization. Additionally, the help of a SailPoint professional can be invaluable, especially if the deployment has a lot of customizations or is large in scale."}]},{"n":null,"q":"What is the difference between IdentityNow and SailPoint Identity Security Cloud?","b":[{"t":"p","x":"Both are cloud-based identity management solutions, but the difference is that SailPoint initially released IdentityNow, a software-as-a-service identity management product, about ten years ago, with SSO and passwords. Over time, the product evolved into a more robust identity security solution. For example, SailPoint added AI capabilities in 2017 and other SaaS components after that. However, a few years ago, SailPoint consolidated the various SaaS capabilities into a single identity security platform called SailPoint Identity Security Cloud that’s driven by AI components. So in short, IdentityNow is a core part of SailPoint Identity Security Cloud."}]},{"n":null,"q":"How long does it take to onboard an application in SailPoint IIQ?","b":[{"t":"p","x":"The timeline to onboard an application in SailPoint IIQ can vary significantly depending on several factors, including the complexity of the application, the availability and format of the user and entitlement data, the integration requirements, and the organization’s experience with IIQ. Here’s a general breakdown to give you an idea:"},{"t":"p","x":"Initial Planning and Requirements Gathering (1–2 weeks)"},{"t":"li","x":"• Stakeholder Meetings: Identify the key stakeholders and gather requirements."},{"t":"li","x":"• Scope Definition: Define the scope of the application to be onboarded, including what data needs to be managed."},{"t":"p","x":"Design and Configuration (2–4 weeks)"},{"t":"li","x":"• Technical Design: Design the technical integration, including how IIQ will connect with the application."},{"t":"li","x":"• Configuration: Begin configuring the application within IIQ, including the connector setup, aggregation tasks, and custom rules if necessary."},{"t":"p","x":"Development and Testing (3–6 weeks) = DEV / QA / UAT"},{"t":"li","x":"• Development: Develop any custom connectors, workflows, or business processes required for the application."},{"t":"li","x":"• Testing: Perform unit, integration, and user acceptance testing (UAT) to ensure the application is correctly integrated and that all the business requirements are met."},{"t":"p","x":"Implementation and Go-Live (1–2 weeks) = STAGING / PRODUCTION"},{"t":"li","x":"• Final Adjustments: Make any necessary adjustments based on the testing feedback."},{"t":"li","x":"• Training: Conduct training sessions for the end users and administrators."},{"t":"li","x":"• Go-Live: Deploy the integration into production."},{"t":"p","x":"Post-Implementation Review (1 week)"},{"t":"li","x":"• Monitoring: Monitor the application integration for any issues."},{"t":"li","x":"• Feedback Gathering: Collect feedback from the users and stakeholders."},{"t":"li","x":"• Review and Adjust: Review the onboarding process and implement any required adjustments or improvements."},{"t":"p","x":"Overall Timeline: Approximately 8 to 15 weeks"},{"t":"p","x":"This timeline is indicative and can vary greatly based on the specific requirements and challenges associated with the application being onboarded. For complex applications, or environments with stringent compliance and security requirements, the timeline may extend further. Similarly, if the organization has a well-defined process for onboarding applications and extensive experience with IIQ, you might be able to reduce the timeline. Continuous communication with the stakeholders and iterative testing and adjustments are key to ensuring a smooth onboarding process."}]},{"n":null,"q":"Cybersecurity tools I’ve come across","b":[{"t":"li","x":"1. SecurityScorecard: SecurityScorecard is a cybersecurity platform that provides security ratings and risk assessments. It evaluates the security posture of organizations by analyzing their online footprint. This analysis includes a wide range of factors like network security, DNS health, patching cadence, endpoint security, and more. Organizations use SecurityScorecard to understand and improve their own security posture, as well as to assess the security of their vendors and partners."},{"t":"li","x":"2. Tenable / Nessus: Tenable Nessus is a widely used vulnerability assessment tool. It helps in identifying vulnerabilities, configuration issues, and security weaknesses in network systems. Nessus scans devices and applications to find vulnerabilities that could be exploited by attackers. It’s known for its extensive plugin library, which is regularly updated to detect the latest known vulnerabilities and compliance issues."},{"t":"li","x":"3. Palo Alto Prisma WAAS: Prisma WAAS (Web Application and API Security) by Palo Alto Networks is a comprehensive web application and API protection solution. It’s designed to secure web applications and APIs from various threats such as cross-site scripting, SQL injection, and other common attack vectors. Prisma WAAS uses advanced threat prevention technologies and is typically deployed to protect applications in public and private clouds."},{"t":"li","x":"4. Sophos Endpoint Antivirus: Sophos Endpoint Antivirus is a security software that provides protection against malware, viruses, and other cyber threats for endpoints like laptops, desktops, and servers. It includes features like real-time protection, ransomware defense, exploit prevention, and centralized management. Sophos Endpoint Antivirus is part of Sophos’ broader endpoint security solutions, which aim to protect devices both on and off the network."},{"t":"p","x":"So each of these tools addresses a different aspect of cybersecurity — from vulnerability assessment and endpoint protection to web application security and overall security posture evaluation."}]},{"n":null,"q":"What is the difference between provisioning and deprovisioning?","b":[{"t":"p","x":"These are opposite ends of the identity lifecycle, and both are essential to managing user access in SailPoint, or in IAM in general."},{"t":"p","x":"Term What It Means Example"},{"t":"p","x":"Provisioning Granting or creating access in a target A new employee is hired → SailPoint provisions system them into AD and assigns apps based on role"},{"t":"p","x":"Deprovisioning Removing or disabling access when no An employee leaves or changes departments →"},{"t":"p","x":"longer needed SailPoint removes their access to HR, Finance"},{"t":"p","x":"apps, etc."},{"t":"p","x":"Why both matter:"},{"t":"li","x":"• Provisioning ensures users can do their jobs from Day 1"},{"t":"li","x":"• Deprovisioning prevents access creep and insider threats"},{"t":"p","x":"For example: if someone moves from Finance to Marketing but still has access to the financial apps — that’s a risk. Deprovisioning fixes it."}]}];

var tokens = [], wordEls = [], cursor = 0, misses = 0, prevCursor = 0;

function todayKey(){ var d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }

async function load(){
  try{
    var r = await window.storage.get(KEY);
    if(r && r.value){ var v = JSON.parse(r.value); for(var k in v){ if(k in S) S[k]=v[k]; } }
  }catch(e){}
  if(S.today.date !== todayKey()) S.today = {date:todayKey(), n:0};

}

}
function flash(t){
  var f=$("flash"); f.textContent=t; f.classList.add("show");
  clearTimeout(f._t); f._t=setTimeout(function(){ f.classList.remove("show"); },1900);
}
function chime(){
  if(!S.sound) return;
  try{
    var C = window.AudioContext||window.webkitAudioContext;
    chime.ac = chime.ac || new C();
    var ac = chime.ac; if(ac.state==="suspended") ac.resume();
    [660,880].forEach(function(f,i){
      var o=ac.createOscillator(), g=ac.createGain(), t=ac.currentTime+i*0.09;
      o.type="sine"; o.frequency.setValueAtTime(f,t);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.14,t+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.22);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+0.25);
    });
  }catch(e){}
}

  nine:"9",ten:"10",eleven:"11",twelve:"12",fifteen:"15",twenty:"20",thirty:"30"};
function norm(w){
  w = w.toLowerCase().replace(/[\u2018\u2019]/g,"'").replace(/[^a-z0-9']/g,"");
  if(!w) return "";
  if(NUMWORD[w]) return NUMWORD[w];
  return w;
}
function same(a,b){
  if(a===b) return true;
  var la=a.length, lb=b.length;
  if(la>3 && lb>3 && Math.abs(la-lb)<=3){
    var n = Math.min(4, Math.min(la,lb));
    if(a.slice(0,n)===b.slice(0,n)) return true;
  }
  return false;
}
function feedWord(raw){
  var w = norm(raw);
  if(!w || completed) return;
  var span = Math.min(50, 14 + misses*4);
  var end = Math.min(tokens.length, cursor + span);
  for(var k=cursor; k<end; k++){
    if(same(tokens[k], w)){
      segHits[Math.min(segs-1, Math.floor(k/segSize))]++;
      cursor = k+1; misses = 0; paint(); check(); return;
    }
  }
  misses++;
}
// every stretch of the answer has to be covered, so skipping ahead can't count
function weakest(){
  var w = 1;
  for(var i=0;i<segs;i++){ var f = segHits[i]/segSize; if(f<w) w=f; }
  return w;
}
function check(){
  var elapsed = (Date.now()-startedAt)/1000;
  var toEnd = cursor >= tokens.length * 0.85;
  if(toEnd && weakest() >= 0.40 && elapsed >= minSeconds){ complete(); return; }
  if(toEnd && elapsed >= minSeconds && !nagged){
    nagged = true;
    var i, worst = 0, low = 2;
    for(i=0;i<segs;i++){ if(segHits[i]/segSize < low){ low = segHits[i]/segSize; worst = i; } }
    var where = worst === 0 ? "near the beginning" : (worst >= segs-1 ? "near the end" : "in the middle");
    $("statusText").textContent = "Got to the end, but a stretch "+where+" never came through — keep reading, or read it again.";
  }
}

/* ---------------- rendering ---------------- */
function paint(){
  var pct = tokens.length ? Math.min(100, Math.round(cursor/tokens.length*100)) : 0;
  $("trackFill").style.width = pct+"%";
  $("track").classList.toggle("full", pct>=85);
  for(var i=prevCursor; i<cursor && i<wordEls.length; i++){
    wordEls[i].classList.add("read"); wordEls[i].classList.remove("now");
  }
  for(var j=cursor; j<prevCursor && j<wordEls.length; j++){
    wordEls[j].classList.remove("read","now");
  }
  if(prevCursor<wordEls.length && wordEls[prevCursor]) wordEls[prevCursor].classList.remove("now");
  if(cursor<wordEls.length && wordEls[cursor]){
    wordEls[cursor].classList.add("now");
    keepInView(wordEls[cursor]);
  }
  prevCursor = cursor;
  lastProgress = Date.now();
  if(listening) updateStatus();
}
function keepInView(el){
  var pane = $("pane");
  var pr = pane.getBoundingClientRect(), er = el.getBoundingClientRect();
  if(er.top < pr.top + pr.height*0.25 || er.bottom > pr.bottom - pr.height*0.25){
    pane.scrollTop += (er.top - pr.top) - pr.height*0.4;
  }
}
function renderAnswer(item){
  var pane = $("pane");
  pane.innerHTML = ""; tokens = []; wordEls = []; cursor = 0; prevCursor = 0; misses = 0; completed = false;
  item.b.forEach(function(block){
    if(block.t === "code"){
      var pre = document.createElement("pre");
      pre.className = "code"; pre.textContent = block.x;
      pane.appendChild(pre); return;
    }
    var p = document.createElement("p");
    p.className = block.t === "li" ? "li" : "";
    block.x.split(/\s+/).forEach(function(word){
      if(!word) return;
      var t = norm(word);
      var s = document.createElement("span");
      s.className = "w"; s.textContent = word;
      if(t){ tokens.push(t); wordEls.push(s); }
      p.appendChild(s); p.appendChild(document.createTextNode(" "));
    });
    pane.appendChild(p);
  });
  pane.scrollTop = 0;
  segs = Math.max(3, Math.min(10, Math.round(tokens.length/50)));
  segSize = tokens.length / segs;
  segHits = new Array(segs).fill(0);
  nagged = false;
  minSeconds = Math.max(4, Math.round(tokens.length / (230/60)));
  $("trackFill").style.width = "0%";
  $("track").classList.remove("full");
}

function jitter(seed){ var x=Math.sin(seed*12.9898)*43758.5453; return ((x-Math.floor(x))*3)-1.5; }
function tallyGroup(n,idx){
  var w = n===5 ? 30 : (n*6+4);
  var s = '<svg width="'+w+'" height="20" viewBox="0 0 '+w+' 20" aria-hidden="true">', c = n===5?4:n;
  for(var i=0;i<c;i++){ var x=3+i*6, a=jitter(idx*10+i); s+='<path d="M'+x+' 3 L'+(x+a)+' 17"/>'; }
  if(n===5){ var b=jitter(idx*10+9); s+='<path d="M1 16 L'+(25+b)+' 4"/>'; }
  return s+'</svg>';
}
function get(n){ return S.counts[n] || 0; }

function render(){
  var item = QA[S.current-1];
  $("qpos").textContent = (item.n ? "Question "+item.n : "Extra") + " · "+S.current+" of "+QA.length;
  $("qtitle").textContent = item.q;
  $("jump").value = String(S.current);

  var c = get(S.current), met = c >= S.goal;
  $("count").textContent = c;
  $("score").classList.toggle("met", met);
  if(document.activeElement !== $("goal")) $("goal").value = S.goal;

  var full = Math.floor(c/5), rest = c%5, html="", cap = Math.min(full,16), i;
  for(i=0;i<cap;i++) html += tallyGroup(5,i);
  if(full>cap) html += '<span class="more">+'+((full-cap)*5)+'</span>';
  if(rest) html += tallyGroup(rest, full);
  $("tally").innerHTML = html;

  $("undo").disabled = S.history.length === 0;
  $("prev").disabled = S.current <= 1;
  $("next").disabled = S.current >= QA.length;
  $("auto").checked = S.auto; $("sound").checked = S.sound;
  $("mListen").classList.toggle("on", S.mode==="listen");
  $("mTap").classList.toggle("on", S.mode==="tap");
  document.documentElement.style.setProperty("--size", S.size+"px");

  var g="", cc, pct, total=0, metN=0, low=Infinity;
  for(i=1;i<=QA.length;i++){
    cc = get(i); total += cc; if(cc>=S.goal) metN++; if(cc<low) low=cc;
    pct = Math.min(100, Math.round(cc/S.goal*100));
    var label = QA[i-1].n ? QA[i-1].n : "•";
    g += '<button class="cell'+(cc>=S.goal?" met":"")+(i===S.current?" on":"")+'" data-i="'+i+'" title="'+
         (QA[i-1].q.replace(/"/g,"&quot;"))+' — read '+cc+'"><i style="height:'+pct+'%"></i><span>'+label+'</span></button>';
  }
  $("grid").innerHTML = g;
  $("sRounds").textContent = low===Infinity?0:low;
  $("sMet").textContent = metN+"/"+QA.length;
  $("sToday").textContent = S.today.n;
  $("gridNote").textContent = total+" reads logged";
}

/* ---------------- counting ---------------- */
function complete(){
  if(completed) return;
  completed = true;
  var n = S.current;
  S.counts[n] = get(n)+1;
  S.history.push(n);
  if(S.history.length>500) S.history.shift();
  if(S.today.date !== todayKey()) S.today = {date:todayKey(), n:0};
  S.today.n++;
  chime();
  stopListening(true);
  var hit = get(n) === S.goal;
  render(); save();
  flash(hit ? "That's "+S.goal+" reads on this one — goal met" : "Counted. That's read "+get(n)+" times.");
  if(S.auto){
    setTimeout(function(){ go(S.current >= QA.length ? 1 : S.current+1); }, 900);
  }else{
    $("statusText").textContent = "Read counted. Press start to read it again.";
  }
}
function undo(){
  if(!S.history.length) return;
  var n = S.history.pop();
  S.counts[n] = Math.max(0, get(n)-1);
  if(S.today.n>0) S.today.n--;
  if(S.current !== n) go(n); else { render(); save(); }
  render(); save();
  flash("Removed one read from "+(QA[n-1].n ? "question "+QA[n-1].n : "that answer"));
}
function go(i){
  if(i<1 || i>QA.length) return;
  stopListening(true);
  S.current = i;
  renderAnswer(QA[i-1]);
  render(); save();
  $("statusText").textContent = "Press start, then read the answer out loud.";
  $("trackFill").style.width="0%";
}

/* ---------------- speech ---------------- */
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var wantListen = false, starting = false, lastHeard = 0, lastProgress = 0;
var watchdog = null, ticker = null, wakeLock = null, drops = 0;

function newRecognizer(){
  var r = new SR();
  r.continuous = true; r.interimResults = true; r.lang = "en-US"; r.maxAlternatives = 1;
  r.onstart = function(){ starting = false; lastHeard = Date.now(); };
  r.onaudiostart = function(){ lastHeard = Date.now(); };
  r.onspeechstart = function(){ lastHeard = Date.now(); };
  r.onresult = function(e){
    lastHeard = Date.now();
    for(var i=e.resultIndex; i<e.results.length; i++){
      var words = e.results[i][0].transcript.trim().split(/\s+/).filter(Boolean);
      var done = fedCounts[i] || 0;
      for(var k=done; k<words.length; k++) feedWord(words[k]);
      fedCounts[i] = words.length;
    }
  };
  r.onerror = function(e){
    if(e.error === "not-allowed" || e.error === "service-not-allowed"){ micBlocked(); stopListening(true); return; }
    if(e.error === "audio-capture"){
      showWarn("No microphone found. Switch to Tap mode below and count with the button instead.");
      stopListening(true); return;
    }
    // no-speech, network, aborted and the rest are normal on a long read — onend picks it back up
  };
  r.onend = function(){ starting = false; if(wantListen) cycle(); };
  return r;
}

// Chrome cuts recognition off every so often on a long read. Rather than fight it,
// start a fresh recognizer each time it drops. Progress through the answer is kept,
// so a five-minute answer just reconnects a few times without losing the count.
function cycle(){
  if(!wantListen || starting) return;
  starting = true;
  var first = !rec;
  if(rec){
    try{ rec.onend = null; rec.onerror = null; rec.onresult = null; rec.abort(); }catch(e){}
    rec = null; drops++;
  }
  setTimeout(function(){
    if(!wantListen){ starting = false; return; }
    fedCounts = {};
    try{
      rec = newRecognizer();
      rec.start();
    }catch(err){
      starting = false;
      setTimeout(cycle, 400);        // engine was still busy — try again shortly
    }
  }, first ? 0 : 140);
}

function startWatchdog(){
  clearInterval(watchdog);
  watchdog = setInterval(function(){
    if(!wantListen) return;
    if(!starting && Date.now() - lastHeard > 9000){ lastHeard = Date.now(); cycle(); }
  }, 2500);
}

function startTicker(){
  clearInterval(ticker);
  ticker = setInterval(updateStatus, 500);
}

function updateStatus(){
  if(!listening) return;
  var pct = tokens.length ? Math.min(100, Math.round(cursor/tokens.length*100)) : 0;
  var el = Math.max(0, Math.floor((Date.now()-startedAt)/1000));
  var t = pct + "% read \u00b7 " + Math.floor(el/60) + ":" + (el%60<10?"0":"") + (el%60);
  if(S.mode === "listen" && Date.now() - lastProgress > 14000){
    t += " \u00b7 not hearing you — check the microphone";
  }
  if(!nagged) $("statusText").textContent = t;
}

async function keepAwake(on){
  try{
    if(on && navigator.wakeLock){ wakeLock = await navigator.wakeLock.request("screen"); }
    else if(wakeLock){ await wakeLock.release(); wakeLock = null; }
  }catch(e){}
}

function startListening(){
  if(!SR){ S.mode="tap"; startTap(); return; }
  wantListen = true; listening = true;
  startedAt = Date.now(); lastHeard = Date.now(); lastProgress = Date.now();
  drops = 0; fedCounts = {}; rec = null;
  $("dot").classList.add("live");
  $("go").textContent = "Stop"; $("go").classList.add("stop");
  $("statusText").textContent = "Listening — read the answer out loud.";
  keepAwake(true);
  startWatchdog();
  startTicker();
  cycle();
}

function stopListening(quiet){
  wantListen = false; listening = false; starting = false;
  clearInterval(watchdog); watchdog = null;
  clearInterval(ticker); ticker = null;
  clearInterval(tapTimer); tapTimer = null;
  keepAwake(false);
  $("dot").classList.remove("live");
  $("go").classList.remove("stop"); $("go").disabled = false;
  $("go").innerHTML = 'Start reading<small>space bar also starts and stops</small>';
  if(rec){ try{ rec.onend=null; rec.onerror=null; rec.onresult=null; rec.abort(); }catch(e){} rec=null; }
  if(!quiet) $("statusText").textContent = "Stopped.";
}

function micBlocked(){
  showWarn("This page can't reach the microphone here. Tap mode below still works, and Listen mode will "+
           "work once the page is served over https — that is what putting it on your Vercel site fixes.");
  S.mode = "tap"; render(); save();
}
function showWarn(msg){ var w=$("warn"); w.textContent=msg; w.classList.remove("hide"); }

/* ---------------- tap mode ---------------- */
function startTap(){
  startedAt = Date.now(); listening = true; completed=false;
  $("dot").classList.add("live");
  $("go").classList.add("stop");
  $("go").disabled = true;
  $("go").innerHTML = 'Keep reading…<small>the button unlocks once a full read is possible</small>';
  tapTimer = setInterval(function(){
    var el = (Date.now()-startedAt)/1000;
    var expected = tokens.length / (150/60);
    $("trackFill").style.width = Math.min(100, el/expected*100)+"%";
    if(el >= minSeconds){
      $("go").disabled = false;
      $("go").innerHTML = 'Done — count this read<small>you have read long enough for a full answer</small>';
      $("statusText").textContent = "Tap when you finish the last line.";
      $("track").classList.add("full");
    }else{
      $("statusText").textContent = "Reading… "+Math.max(0,Math.ceil(minSeconds-el))+"s before this can count";
    }
  },250);
}

/* ---------------- wiring ---------------- */
function toggle(){
  if(listening){
    if(S.mode==="tap" && !$("go").disabled){ complete(); }
    else stopListening();
  }else{
    completed = false; cursor = 0; prevCursor = 0; misses = 0; nagged = false;
    segHits = new Array(segs).fill(0);
    wordEls.forEach(function(el){ el.classList.remove("read","now"); });
    $("trackFill").style.width="0%"; $("track").classList.remove("full");
    if(S.mode==="listen") startListening(); else startTap();
  }
}

function wire(){
  $("go").addEventListener("click", toggle);
  $("prev").addEventListener("click", function(){ go(S.current-1); });
  $("next").addEventListener("click", function(){ go(S.current+1); });
  $("undo").addEventListener("click", undo);
  $("mListen").addEventListener("click", function(){ stopListening(true); S.mode="listen"; render(); save(); });
  $("mTap").addEventListener("click", function(){ stopListening(true); S.mode="tap"; render(); save(); });
  $("bigger").addEventListener("click", function(){ S.size=Math.min(30,S.size+2); render(); save(); });
  $("smaller").addEventListener("click", function(){ S.size=Math.max(15,S.size-2); render(); save(); });
  $("jump").addEventListener("change", function(){ go(+this.value); });
  $("grid").addEventListener("click", function(e){
    var b = e.target.closest("[data-i]"); if(b) go(+b.dataset.i);
  });
  $("goal").addEventListener("change", function(){
    var v = parseInt(this.value,10); if(v>0 && v<1000) S.goal=v; render(); save();
  });
  $("auto").addEventListener("change", function(){ S.auto=this.checked; save(); });
  $("sound").addEventListener("change", function(){ S.sound=this.checked; if(this.checked) chime(); save(); });
  $("reset").addEventListener("click", function(){
    if(!confirm("Clear every count and start from zero?")) return;
    S.counts={}; S.history=[]; S.today={date:todayKey(),n:0};
    render(); save(); flash("Counts cleared");
  });
  document.addEventListener("keydown", function(e){
    var t = e.target.tagName;
    if(t==="INPUT"||t==="SELECT"||t==="TEXTAREA") return;
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    if(e.code==="Space"){ e.preventDefault(); toggle(); }
    else if(e.code==="ArrowRight" && !listening){ e.preventDefault(); go(S.current+1); }
    else if(e.code==="ArrowLeft" && !listening){ e.preventDefault(); go(S.current-1); }
    else if(e.key==="z"){ e.preventDefault(); undo(); }
  });
  window.addEventListener("beforeunload", function(){ stopListening(true); });
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible" && wantListen){ keepAwake(true); lastHeard = Date.now(); cycle(); }
  });
}

/* ---------------- start ---------------- */
(async function(){
  await load();
  var opts = "";
  QA.forEach(function(o,i){
    var label = (o.n ? o.n+". " : "• ") + o.q;
    opts += '<option value="'+(i+1)+'">'+label.replace(/</g,"&lt;").slice(0,72)+'</option>';
  });
  $("jump").innerHTML = opts;
  if(!SR){
    S.mode = "tap";
    showWarn("This browser can't listen along. Tap mode is on: read the answer, and the button unlocks "+
             "once enough time has passed for a full read. Chrome on your Mac supports Listen mode.");
  }
  renderAnswer(QA[S.current-1]);
  render();
  wire();
})();

})();
</script>
</body>
</html>
