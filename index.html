collusion to commit fraud.\nFor example, in finance applications you might have a\nSoD rule that says a single person should not have the\nability to create a vendor in the system and approve\npayments to that vendor. This would prevent the\npossibility of an individual creating fictitious vendors and\napproving payments to them. In IIQ, if someone tried to\nrequest these two permissions, the SoD rule would trigger\nan alert or block the request.", "k": ["segregation of duties", "approval", "entitlement", "compliance"], "s": "Certification"}, {"n": 50, "q": "What is Advanced Analytics in SAILPOINT IDENTITY IQ? How is it used?", "a": "Advanced Analytics in SAILPOINT IDENTITY IQ is a\npowerful tool used to generate insightful and actionable\ndata based on a variety of factors related to user identity\nand access management. This includes data on identities,\naccess privileges, applications, risk scoring, and more.\nAdvanced Analytics is utilized through a combination of\npredefined and customizable dashboards, reports, and\nalerts to enable the management and security teams to\nmake informed decisions, identify trends, spot anomalies,\nand ensure regulatory compliance.\nHere are some ways in which Advanced Analytics in\nSAILPOINT IDENTITY IQ can be used:\n● Risk Analysis and Management: The analytics tool can\nhelp identify high risk areas in an organization's IT\nenvironment. For example, it can highlight users with\nexcessive access rights or pinpoint access rights that are\ncommonly given but rarely used. This can also aid in\nimplementing a policy of least privilege.\n● Insights into User Behavior: SAILPOINT IDENTITY\nIQ can track and analyze the activities of individual users\nor groups. This can help to identify abnormal behavior,\nsuch as a user suddenly accessing data they typically\ndon't, which could be a sign of a security breach.\n● Compliance and Reporting: Organizations can use\nAdvanced Analytics to maintain regulatory compliance.\nThey can quickly generate detailed reports required for\ninternal audits or by external regulatory bodies.\n● Operational Efficiency: By analyzing trends in user\naccess requests and approvals, organizations can identify\nbottlenecks or inefficiencies in their processes.\n● Predictive Capabilities: Leveraging machine learning,\nSAILPOINT IDENTITY IQ Advanced Analytics can help\npredict potential risks or security threats by analyzing\nhistorical data and trends.\n● Identity and Access Certifications: Advanced Analytics\ncan help streamline the certification process by providing\nclear visibility into access privileges, roles, and other\nrelevant information.\nBasic but very useful to mention example of it will\nduring the troubleshooting the issues where you can\nuse Advanced Analytics to search for Syslog and\nlook at the point of failures and fix it. If there is an\nissue with the custom rules you can use debug screen\nand test them there.", "k": ["debug page", "least privilege", "analytics / risk", "custom rule", "approval", "logs", "troubleshooting", "access request"], "s": "Certification"}, {"n": 51, "q": "What is Audit Reporting, and Have you used it?", "a": "Yes, I used it, and it is a vital component of the platform\nthat assists organizations in maintaining compliance,\nensuring security, and understanding user access. It\ngenerates detailed reports about user access and activities,\nincluding what, when, who, and how of access rights\nwithin the organization.\nAudit Reports can also highlight potential issues, such as\npolicy violations or risky entitlements, allowing\norganizations to mitigate security risks and address\ncompliance issues proactively and used for regulatory\ncompliance purposes, internal audits, or investigations\ninto specific incidents.", "k": ["audit reporting", "entitlement", "compliance", "reports", "organizations"], "s": "Certification"}, {"n": 52, "q": "Can you share an instance where audit reporting helped uncover a significant issue?", "a": "During a routine security audit using SAILPOINT\nIDENTITY IQ's Audit Reporting feature, I generated a\ncomprehensive report encapsulating details about user\naccounts and their corresponding access privileges. I\nstumbled upon an alarming find: an array of \"orphan\naccounts.\"\nThese orphan accounts are essentially user accounts that\nremained in the system but weren't associated with any\nactive employees or users. Such accounts pose a\nconsiderable security risk to the organization.\nLeveraging the Audit Reporting feature, I was able to\nswiftly identify all the orphan accounts in the system. I\nsubsequently disabled or deleted these accounts. Further,\nI took a deep dive into our overall user account\nmanagement process to prevent similar oversights in the\nfuture.\nSAILPOINT LCM MODULE AND JML\nEVENTS", "k": ["orphan account", "lifecycle manager", "audit reporting", "joiner mover leaver", "deprovisioning", "compliance"], "s": "Certification"}, {"n": 53, "q": "Can you define Life Cycle Manager (LCM)?", "a": "SailPoint's LCM provides a comprehensive solution for\nmanaging the entire identity lifecycle, from onboarding to\noffboarding, in a user friendly, automated, and policy\ndriven manner. It integrates identity governance, access\nrequest, automated provisioning, and password\nmanagement into a single, unified solution.\nHere are the key components of LCM:\n● Joiner: When a new employee joins the company, LCM\nautomates the process of providing the appropriate access\nrights. It uses role-based access control (RBAC) and\naccess policies to determine which rights the new\nemployee should have, based on their role, department,\nlocation, etc.\n● Mover: When an employee changes roles within the\norganization, LCM handles the process of updating their\naccess rights. It can remove access rights that are no longer\nneeded and provide new ones that are required for the new\nrole.\n● Certifications and Audits: LCM supports the process of\nperiodically reviewing and certifying access rights. This\ncan help the organization stay compliant with various\nregulations and maintain a strong security posture.\n● Leaver: When an employee leaves the company, LCM\nautomates the process of revoking their access rights. This\nhelps to minimize the risk of unauthorized access.\n● Self-Service and Delegated Administration: LCM\nprovides a self-service portal where users can request\nadditional access, manage their own passwords, etc. It also\nsupports delegated administration, allowing managers or\ndepartment heads to handle access requests for their teams.\n● Provisioning and Deprovisioning: With integration to\nvarious IT resources, LCM can automatically provision\nand deprovision access on various systems and\napplications, reducing the manual workload on the IT\nteam.", "k": ["lifecycle manager", "authorization", "RBAC", "joiner mover leaver", "stakeholders", "performance", "access request", "certification"], "s": "LCM & JML"}, {"n": 54, "q": "When Joiner Mover Leaver (JML) events are triggered what happens to HRMS?", "a": "In the context of an Identity Governance and\nAdministration (IGA) system such as SailPoint\nIdentityIQ, Joiner Mover Leaver (JML) processes refer to\nthe lifecycle events of users in an organization.\n● Joiners are new employees who are joining the\norganization.\n● Movers are existing employees who are changing roles\nwithin the organization.\n● Leavers are employees who are leaving the organization.\nThese JML events often trigger updates in both the\nHuman Resource Management System (HRMS) and the\nIGA system, like IdentityIQ, because changes in an\nemployee's status or role typically require changes in their\naccess rights.\nWhen a JML event is triggered:\n1. For a Joiner, a new record is created in the HRMS\ndatabase reflecting the details of the new employee. This\nrecord includes all necessary attributes like name,\ndepartment, role, manager, etc.\n2. For a Mover, the existing employee's record in the HRMS\ndatabase is updated to reflect the change in their role,\ndepartment, manager, location, etc.\n3. For a Leaver, the employee's record is typically updated\nin the HRMS to indicate their departure. Depending on the\norganization's policy, the record might be later archived or\ndeleted.\nOnce these changes are reflected in the HRMS, they also\nneed to be reflected in the IGA system to ensure that the\nemployees' access rights are appropriately adjusted. This\nis typically done by a process known as reconciliation or\naggregation, where the IGA system periodically\nsynchronizes with the HRMS database to detect any\nchanges and adjust access rights accordingly.\nFor example, when a new joiner record is detected in the\nHRMS database, the Identity Governance and\nAdministration (IGA) system would initiate the\nonboarding process, provisioning the new user with the\naccess rights appropriate for their role. For a mover, the\nsystem would adjust their access rights according to their\nnew role, possibly revoking some access and granting\nother access. For a leaver, the system would initiate the\noffboarding process, revoking all their access to prevent\nany potential security risks.", "k": ["reconciliation", "joiner mover leaver", "lifecycle event", "HR system", "aggregation", "deprovisioning", "provisioning", "role"], "s": "LCM & JML"}, {"n": 55, "q": "Provide additional details on how JML events are triggered and executed in SAILPOINT IDENTITY IQ?", "a": "A JML event is typically triggered based on changes in\nthe HRMS (Human Resource Management System)\ndatabase. The HRMS database contains the data about\nemployees, including their roles, departments,\nemployment status, etc. When an employee joins the\ncompany, changes roles, or leaves the company, this\ninformation is updated in the HRMS database.\nHere is a more detailed look at how these events are\ntriggered and what happens:\n1. Joiner: When a new employee is added to the HRMS\ndatabase, a Joiner event is triggered. The IAM system (like\nSAILPOINT IDENTITY IQ) receives this event, typically\nthrough an automated process like a scheduled import or\nvia a realtime API call. Based on the new employee's role,\ndepartment, and other attributes, the IAM system\ndetermines which access rights the employee should have.\nThe IAM system then provisions these access rights on the\nvarious IT systems and applications that the employee\nneeds to use.\n2. Mover: When an employee's role, department, or other\nattribute changes in the HRMS database, a Mover event is\ntriggered. The IAM system receives this event and\nreevaluates the employee's access rights. It may revoke\nsome access rights that are no longer appropriate, and\nprovision new ones that are required for the new role or\ndepartment.\n3. Leaver: When an employee is marked as having left the\ncompany in the HRMS database, a Leaver event is\ntriggered. The IAM system receives this event and revokes\nall the access rights associated with the employee, ensuring\nthat they can no longer access the company's IT systems\nand applications.\nThese JML events help automate the management of\naccess rights, ensuring that each employee always has the\nappropriate access. They also help improve security by\nensuring that access is revoked promptly when an\nemployee leaves the company. Additionally, by\nautomating these processes, the JML events help reduce\nthe workload on the IT department and reduce the risk of\nhuman error.\nSAILPOINT PATCHING AND\nUPGRADE.\nPatching: Applying a patch in SAILPOINT IDENTITY\nIQ is a crucial step in maintaining the integrity and\nperformance of your system, as patches often contain\nimportant security updates, bug fixes, and enhancements.\nThe specific process can vary depending on the system\narchitecture and operational policies, but here are some\ngeneral steps to apply a patch in SAILPOINT IDENTITY\nIQ:\n1. Backup: Before you apply a patch, it's crucial to back up\nyour system. This includes your database, configuration\nfiles, and custom files.\n2. Download the Patch: Patches for SAILPOINT\nIDENTITY IQ are typically provided by SailPoint in a\ndownloadable file format. They are usually available on\nthe SailPoint customer support website. You should\ndownload the appropriate patch based on your current\nSAILPOINT IDENTITY IQ version.\n3. Inspect Patch Notes: Review the patch notes provided by\nSailPoint. They often include important information about\nwhat the patch does, what issues it addresses, and any\npotential side effects or requirements.\n4. Test the Patch: It is good practice to first apply the patch\nin a test or development environment before deploying it\nin the production environment. This allows you to identify\nand resolve any potential issues without impacting your\nproduction system.\n5. Apply the Patch: To apply the patch, you generally need\nto stop the SAILPOINT IDENTITY IQ application, move\nthe patch files to the appropriate directories, and then\nrestart the application. The specific process can depend on\nthe patch and your system configuration.\n6. Verify the Patch: After the patch has been applied, verify\nthat it has been successfully installed. This could involve\nchecking system logs, version numbers, or using features\naddressed by the patch.\n7. Document the Patch: Document all changes, including\nthe patch applied, the date, the reason for the patch, and\nany issues encountered during the process.\nUpgrading: SAILPOINT IDENTITY IQ involves a\nsequence of steps that ensure smooth transition from an\nolder version to a newer one. Here's a broad overview of\nthe upgrade process.\n1. Backup: Before beginning the upgrade process, it's crucial\nto back up all relevant data, including the database, custom\nfiles, configurations, etc. This allows you to restore the\nsystem to its previous state in case something goes wrong\nduring the upgrade.\n2. Understand the Changes: Review the product release\nnotes and documentation for the new version. This will\nhelp you understand what changes, enhancements, or\ndeprecations are included in the upgrade.\n3. Test the Upgrade in a Nonproduction Environment: It's\na best practice to test the upgrade process in a development\nor staging environment before deploying it to the\nproduction environment. This will allow you to identify\nany potential issues or conflicts in a controlled setting.\n4. Prepare for the Upgrade: This involves steps such as\ndisabling scheduled tasks, informing users about the\nscheduled downtime, and making sure you have all the\nnecessary software and hardware resources to carry out the\nupgrade.\n5. Execute the Upgrade: Start the upgrade process as per the\ninstructions provided by SailPoint. This typically involves\ninstalling the new software, migrating the data, and\nrunning scripts to update the database schema, among\nother tasks.\n6. Validate the Upgrade: Once the upgrade is complete,\nvalidate the installation by running tests to ensure\neverything is functioning as expected. Check whether all\ndata is intact and whether all workflows, connectors, and\ncustomizations are working properly.\n7. Post Upgrade Tasks: These might include reenabling\nscheduled tasks, updating configurations, and performing\nany necessary remediation tasks that have been identified\nduring the validation process.\n8. Communicate the Upgrade: Once everything has been\nverified and the system is stable, inform your users that the\nupgrade is complete, and the system is back online.\nIt's crucial to plan and manage the upgrade process\ncarefully to ensure minimal disruption to your\norganization. Additionally, the help of a SailPoint\nprofessional can be invaluable, especially if your\ndeployment has a lot of customizations or is large in\nscale.", "k": ["patch / release notes", "test environment", "backup", "downtime", "remediation", "scheduled task", "architect vs developer", "scalability"], "s": "LCM & JML"}, {"n": 56, "q": "Services Standard Deployment SSD (SSB in version 7) in SAILPOINT IDENTITY IQ — what is it?", "a": "version 7) in SAILPOINT IDENTITY IQ\n1. Services: This typically refers to the various\nfunctionalities offered by SAILPOINT IDENTITY IQ,\nsuch as access certification, password management,\nidentity lifecycle management, etc.\n2. Standard: This might indicate the use of out of the box\nSAILPOINT IDENTITY IQ features and functionalities\nwithout heavy customization. A standard deployment\nwould aim to utilize the core capabilities of SAILPOINT\nIDENTITY IQ, modifying configurations as necessary but\navoiding significant code alterations.\n3. Deployment: This refers to the process of setting up and\nconfiguring SAILPOINT IDENTITY IQ within an\norganization's IT environment. This can involve tasks like\nsetting up the SAILPOINT IDENTITY IQ server,\nintegrating SAILPOINT IDENTITY IQ with other IT\nsystems (like HR systems, databases, or directory\nservices), configuring SAILPOINT IDENTITY IQ\nfunctionalities, and testing the setup.\nSo \"Services Standard Deployment\" could potentially\nrefer to the process of deploying SAILPOINT IDENTITY\nIQ's services in an organization's IT environment using\nstandard, out of the box configurations, and settings. It's\nalways recommended to verify this with the source or\ncontext where the term is being used, as terminologies\nand meanings can vary based on specific organizational\nor project contexts.\nIn non-IT terms, Services Standard Deployment (SSD) in\nSAILPOINT IDENTITY IQ can be thought of like a pre-\nbuilt recipe for setting up IIQ. It provides a common\nstarting point that ensures a baseline level of functionality\nfor managing user access and identities.\nImagine you're building a house. The standard building\ncode defines the basic structure, safety features, and\nessential elements like walls and a roof. This is like the\nbaseline functionality provided by SSD in IIQ.\nHere's a breakdown:\n● Services: These are the core functionalities of IIQ, like\nmanaging user access requests, provisioning accounts, and\nreviewing user access.\n● Standard Deployment: This refers to a pre-configured\nway of setting up these functionalities. It’s like having a\npre-designed house plan that outlines where the rooms,\ndoors, and windows go.\nMIGRATION FROM IIQ TO ISC (former\nIdentityNow - IDN)", "k": ["patch / release notes", "out-of-the-box connector", "migration", "access request", "customization", "HR system", "testing", "certification"], "s": "Patching & upgrade"}, {"n": 57, "q": "What is the difference between IdentityNow and SailPoint Identity Security Cloud?", "a": "Both are cloud-based identity management solutions,\nbut the difference is that SailPoint initially released\nIdentityNow software-as-a-service identity management\nabout ten years ago, with SSO and passwords. Over time,\nthe product evolved into a more robust identity security\nsolution. For example, SailPoint added AI capabilities in\n2017 and other SAAS components after that. However, a\nfew years ago, SailPoint consolidated the various SAAS\ncapabilities into a single identity security platform called\nSailPoint Identity Security Cloud that’s driven by AI\ncomponents. In short, IdentityNow is a core part of\nSailPoint Identity Security Cloud.", "k": ["SSO", "cloud vs on-prem", "years", "identitynow", "components"], "s": "IIQ to ISC"}, {"n": 58, "q": "Have you worked on SailPoint ISC?", "a": "In my previous role at XYZ job, I had the opportunity to\nwork on a significant project on SP ISC.", "k": ["role", "opportunity", "previous"], "s": "IIQ to ISC"}, {"n": 59, "q": "What are the differences between SAILPOINT IDENTITY IQ and SP ISC?", "a": "● SailPoint Identity Security Cloud (SP ISC):\nSAILPOINT IDENTITY SECURITY CLOUD is a\ncloud-based identity management solution offered by\nSailPoint. It allows organizations to manage user\nidentities and access rights securely in the cloud. One of\nthe key advantages of SAILPOINT IDENTITY\nSECURITY CLOUD is its flexibility and scalability, as it\nleverages cloud infrastructure, making it easier to adapt to\nchanging business needs and handle varying user loads.\n● SAILPOINT IDENTITY IQ:\nOn the other hand, SAILPOINT IDENTITY IQ is an on-\npremises identity management solution from SailPoint.\nUnlike SAILPOINT IDENTITY SECURITY CLOUD,\nwhich is hosted in the cloud, SAILPOINT IDENTITY IQ\nis installed and maintained locally on the organization's\nservers. SAILPOINT IDENTITY IQ offers more\ncustomization options, allowing organizations to tailor the\nsolution to their specific requirements. However, this may\nalso mean that the deployment and maintenance of\nSAILPOINT IDENTITY IQ can be more involved and\ntime consuming compared to SAILPOINT IDENTITY\nSECURITY CLOUD's cloud-based deployment.\n● Differences:\nThe primary differences between SAILPOINT IDENTITY\nIQ and SAILPOINT IDENTITY SECURITY CLOUD lie\nin their deployment models and the level of customization\nthey offer. SAILPOINT IDENTITY SECURITY CLOUD,\nbeing a cloud-based solution, offers greater ease of\ndeployment and scalability compared to the on premises\nSAILPOINT IDENTITY IQ. SAILPOINT IDENTITY IQ,\non the other hand, provides more granular control and\ncustomization options, which may be desirable for\norganizations with highly specific or complex identity\nmanagement requirements.\n● Experience with SP ISC:\nIn my experience working with SP ISC, I have found it to\nbe a robust and efficient cloud- based identity management\nsolution. Its SaaS nature makes it relatively quick to deploy\nand easy to manage. The cloud infrastructure also ensures\nautomatic updates and maintenance, reducing the burden\non the organization's IT team.\n● I've also noticed that the choice between SAILPOINT\nIDENTITY IQ and SP ISC heavily depends on the\norganization's unique needs and context. For organizations\nwith straightforward identity management requirements\nand a preference for cloud-based solutions, SP ISC proves\nto be an excellent choice. On the other hand, if an\norganization requires extensive customization and has\nstrict compliance or security considerations that demand an\non-premises solution, SAILPOINT IDENTITY IQ might\nbe the better fit.", "k": ["scalability", "cloud vs on-prem", "performance", "customization", "compliance"], "s": "IIQ to ISC"}, {"n": 60, "q": "Provide me steps on how you migrate to SAILPOINT IDENTITY SECURITY CLOUD?", "a": "● Assessment and Planning: Understand and compare\nSAILPOINT IDENTITY IQ and SAILPOINT IDENTITY\nSECURITY CLOUD systems, plan migration process with\nscope, timeline, and risks in mind.\n● Data Backup and Preparation: Perform full data backup\nfrom SAILPOINT IDENTITY IQ, ensure data integrity,\nand prepare for migration.\n● Infrastructure Setup: Set up necessary infrastructure for\nSAILPOINT IDENTITY SECURITY CLOUD, including\nservers and databases.\n● Data Migration: Transfer data from SAILPOINT\nIDENTITY IQ to SAILPOINT IDENTITY SECURITY\nCLOUD using scripts or migration tools, verify data\nintegrity.\n● Application Migration: Migrate custom applications and\nintegrations from SAILPOINT IDENTITY IQ to\nSAILPOINT IDENTITY SECURITY CLOUD while\npreserving functionality.\n● Testing: Conduct comprehensive testing to resolve any\nissues, including functionality, regression, and\nperformance testing.\n● User Training and Documentation: Train users on\nSAILPOINT IDENTITY SECURITY CLOUD usage,\nprovide detailed documentation for effective navigation.\n● Rollout and Monitoring: Gradually roll out SAILPOINT\nIDENTITY SECURITY CLOUD to users, monitor system\nclosely for post migration issues.\n● Post Migration Support: Offer ongoing support to address\nuser questions and ensure system stability.", "k": ["pilot rollout", "backup", "data integrity", "training / adoption", "documentation", "migration", "performance", "testing"], "s": "IIQ to ISC"}, {"n": 61, "q": "How do you cope or deal with timelines on implementing SailPoint specific tasks?", "a": "1.Understand the Scope and Requirements\n● Clearly define the project scope: Know what applications\nand systems need to be integrated, the specific\nfunctionalities to be implemented (like provisioning,\ncompliance management, etc.), and the compliance\nrequirements.\n● Gather detailed requirements: Ensure you have a\ncomprehensive understanding of the technical and\nbusiness requirements before planning the implementation\ntimeline.\n2.Plan and Prioritize\n● Create a detailed project plan: Break down the project into\nmanageable tasks and sub-tasks. Use project management\ntools to outline these tasks along with their dependencies.\n● Prioritize tasks: Identify critical tasks that could impact the\ntimeline if delayed and prioritize them. Consider the Pareto\nprinciple (80/20 rule) to focus on tasks that will have the\nmost significant impact.\n3.Set Realistic Timelines\n● Estimate time realistically: Use historical data, if available,\nand consult with team members to set realistic timelines\nfor each task.\n● Include buffer times: Always include buffer times for\nunexpected delays or issues, especially for complex tasks\nor those dependent on external factors.\n4.Use Agile Methodologies\n● Adopt an agile approach: Implementing SailPoint can\nbenefit from agile methodologies, which allow for\nflexibility, regular feedback, and iterative development.\n● Sprint planning: Divide the project into sprints, with each\nsprint delivering a piece of the functionality, allowing for\nadjustments as the project progresses.\n5.Communicate Effectively\n● Regular updates: Keep all stakeholders informed with\nregular updates on progress, challenges, and changes in\ntimelines.\n● Stakeholder engagement: Engage stakeholders throughout\nthe project to ensure their requirements are met and to\nmanage their expectations.\n6.Monitor and Adjust\n● Track progress: Regularly monitor the progress against the\nplan and adjust timelines as necessary.\n● Risk management: Identify potential risks early and have\ncontingency plans in place to mitigate them without\nsignificantly affecting the timeline.\n7.Leverage Expertise\n• Utilize experienced resources: Rely on team members with\nSailPoint experience or consider hiring consultants for\ncritical aspects of the project to ensure tasks are completed\nefficiently.\n• Training and knowledge sharing: Invest in training for\nyour team to build internal competencies, which can help\nin smoother implementation and troubleshooting.\n8.Automation and Integration Tools\n• Automate repetitive tasks: Use automation tools where\npossible to speed up implementation tasks, such as data\nmigration or report generation.\n• Leverage integration tools: Utilize available integration\ntools and APIs provided by SailPoint for connecting with\nother systems, which can save time and effort.\n9.Quality Assurance\n• Regular testing: Implement a robust testing strategy to\ncatch and resolve issues early, reducing the risk of delays\ncloser to the deployment date.\n• Feedback loops: Create mechanisms for rapid feedback\nduring testing phases to quickly address any concerns or\nbugs.\n10.Manage Change Effectively\n• Change management: Prepare for and manage the human\naspect of change, including training for users and\nadministrators, to ensure a smooth transition to the new\nsystem.", "k": ["Jira", "stakeholders", "training / adoption", "migration", "troubleshooting", "web services / REST", "testing", "compliance"], "s": "IIQ to ISC"}, {"n": 62, "q": "Are you proficient in Java? Which IDE Tools have you used?", "a": "While my primary expertise is not in Java, I have a\nfoundational understanding of it, which helps me navigate\nand configure identity management solutions like\nSailPoint effectively. My experience has involved\nleveraging Java-based configurations and understanding\nthe basic logic behind customizations in SailPoint", "k": ["Java", "customization", "understanding", "foundational", "behind"], "s": "IIQ to ISC"}, {"n": 63, "q": "Difference between Java and Beanshell?", "a": "In the context of SailPoint, Java is the core programming\nlanguage used for creating more complex customizations\nand integrations. BeanShell, on the other hand, is used\nwithin SailPoint for scripting. It allows for executing\nJava-like scripts directly without the need for\ncompilation, making it useful for quick tweaks or\nconfigurations. Essentially, Java offers the structure and\ndepth needed for developing robust solutions, while\nBeanShell provides the flexibility for on-the-fly script\nexecution within the SailPoint environment.", "k": ["Java", "BeanShell", "customization", "tweaks", "programming"], "s": "IIQ to ISC"}, {"n": 64, "q": "Which IDE Tools have you used?", "a": "I am familiar with Jet Brain’s IntelliJ IDEA and I have\nused Community Edition.”\nSAILPOINT IDENTITY SECURITY\nCLOUD", "k": ["IntelliJ", "idea", "edition", "community", "brain"], "s": "IIQ to ISC"}, {"n": 65, "q": "Can you explain the concept of identity governance and its significance in Identity Security Cloud?", "a": "Identity governance involves managing user access rights\nto ensure the right people have the right access at the right\ntime. In Identity Security Cloud, it's the foundation of\nautomating provisioning, enforcing compliance,\nmanaging roles, and auditing user activity.", "k": ["compliance", "provisioning", "role", "right", "enforcing"], "s": "Identity Security Cloud"}, {"n": 66, "q": "What are the key components of the Identity Security Cloud?", "a": "Key components include Identity Security Cloud,\nIdentityAI (for analytics), cloud governance, non-\nemployee risk management, and integrations with other\nSaaS and on-prem systems.", "k": ["analytics / risk", "cloud vs on-prem", "non-", "integrations", "components"], "s": "Identity Security Cloud"}, {"n": 67, "q": "How do you onboard an application into Identity Security Cloud?", "a": "You onboard applications using out-of-the-box\nconnectors or custom connectors. The process includes\ndefining source configuration, attribute mapping, setting\nup account aggregation, provisioning, and access request\ncapabilities.\nExample: At my XYZ Project, I onboarded Workday\nusing the Web Services connector. We mapped employee\nattributes like employeeID, jobTitle, and department, and\nenabled birthright provisioning based on roles.", "k": ["birthright access", "attribute mapping", "custom connector", "out-of-the-box connector", "access request", "HR system", "web services / REST", "aggregation"], "s": "Identity Security Cloud"}, {"n": 68, "q": "What is the process for creating and managing identity profiles?", "a": "Identity profiles are created to define how identities are\ncorrelated, transformed, and classified. You map\nattributes from authoritative sources, define identity\nlifecycle states, and assign provisioning policies based on\nroles or attributes.\nExample: At my XYZ Project, we built an identity\nprofile that pulled from Oracle HCM and used jobCode\nand region to assign application access.", "k": ["identity profile", "lifecycle state", "correlation", "source of truth", "Oracle", "HR system", "role"], "s": "Identity Security Cloud"}, {"n": 69, "q": "How is multi-factor authentication configured in Identity Security Cloud?", "a": "MFA is typically enforced via integration with IdPs like\nOkta or Azure AD. Identity Security Cloud leverages\nthese platforms to challenge users during login or\nsensitive actions.\nExample: At my XYZ Project, we integrated Identity\nSecurity Cloud with Okta to enforce MFA for any\nidentity accessing the Request Center.", "k": ["MFA", "Okta", "Entra / Azure AD", "Active Directory", "access request"], "s": "Identity Security Cloud"}, {"n": 70, "q": "Can you describe the steps to manage virtual appliances within Identity Security Cloud?", "a": "Virtual appliances act as bridges for on-prem\nconnectivity. Steps include downloading the OVA,\ndeploying it on a hypervisor, registering it with Identity\nSecurity Cloud, and configuring it for specific connectors.\nExample: We deployed two virtual appliances in HA\nmode for AD and SAP connectors, ensuring redundancy\nand faster job execution.", "k": ["virtual appliance", "SAP", "cloud vs on-prem", "performance", "Active Directory", "customization", "connector"], "s": "Identity Security Cloud"}, {"n": 71, "q": "What are the different lifecycle states in Identity Security Cloud, and how are they managed?", "a": "Typical states include onboarding, active, inactive, and\nterminated. These are managed using lifecycle events\ntriggered by attribute changes or external events from HR\nsystems.\nExample: When a Workday feed set a terminationDate,\nIdentity Security Cloud automatically triggered the\n\"terminated\" lifecycle state and deprovisioned access.", "k": ["lifecycle state", "lifecycle event", "HR system", "deprovisioning", "provisioning"], "s": "Identity Security Cloud"}, {"n": 72, "q": "How does Identity Security Cloud handle automated provisioning and deprovisioning?", "a": "Through policies and lifecycle events, Identity Security\nCloud provisions or deprovisions accounts based on role\nassignments, changes in user attributes, or termination\nsignals from authoritative sources.\nExample: A new hire in Salesforce Sales Ops\nautomatically received Salesforce and AD access based\non location and department.", "k": ["source of truth", "Salesforce", "lifecycle event", "Active Directory", "deprovisioning", "provisioning", "role"], "s": "Identity Security Cloud"}, {"n": 73, "q": "What is the role of lifecycle events in managing user access?", "a": "Lifecycle events help automate transitions like hire,\ntransfer, or termination. They trigger provisioning\nworkflows to assign or remove access based on rules\ndefined in the identity profile.\nExample: When a user transferred to a new region, a\nlifecycle event triggered a deprovision of old regional\nsystems and provisioning of new ones.", "k": ["identity profile", "lifecycle event", /* ---------- concept checking ---------- */
function rxFor(key){
  if(PATTERNS[key]) return new RegExp(PATTERNS[key],'i');
  return new RegExp('\\b'+key.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\w*','i');
}
const RXC={};
function conceptHit(key,text){ (RXC[key]=RXC[key]||rxFor(key)); return RXC[key].test(text); }

/* how much of it was word-for-word off the page vs in his own words */
function verbatim(said,ref){
  const norm=t=>t.toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(Boolean);
  const a=norm(said), b=new Set();
  const bw=norm(ref);
  for(let i=0;i+4<bw.length;i++) b.add(bw.slice(i,i+5).join(' '));
  if(a.length<25) return 0;
  let m=0,tot=0;
  for(let i=0;i+4<a.length;i++){ tot++; if(b.has(a.slice(i,i+5).join(' '))) m++; }
  return tot? m/tot : 0;
}

function grade(said){
  if(!said.trim()){ return null; }
  const keys=cur.k||[];
  const hit=keys.filter(k=>conceptHit(k,said));
  const miss=keys.filter(k=>!hit.includes(k));
  const cov=keys.length? hit.length/keys.length : 0;
  const words=said.trim().split(/\s+/).length;
  return {hit,miss,cov,words,vb:verbatim(said,cur.a)};
}

function showScore(g){
  if(!g){ $('verdict').innerHTML='Nothing heard yet. <small>Say your answer first, or type it in.</small>'; 
          $('chips').innerHTML=''; $('barfill').style.width='0%'; $('score').classList.add('on'); return; }
  const pct=Math.round(g.cov*100);
  $('barfill').style.width=pct+'%';
  $('barfill').style.background = pct>=75?'var(--yes)' : pct>=45?'var(--signal)' : 'var(--no)';

  let head, sub;
  if(pct>=85){ head='Full coverage.'; sub='You hit the concepts this answer is built on. Reveal it and check your wording, then move on.'; }
  else if(pct>=60){ head='Most of it, with holes.'; sub='The shape is right but you left pieces out. The missed chips below are what an interviewer would probe.'; }
  else if(pct>=30){ head='Partial recall.'; sub='You know the topic but not the structure yet. Read the answer, then come back to this one.'; }
  else { head='Not there yet.'; sub='Read it properly, say it again out loud, and let it come back around.'; }

  if(g.words<25) sub='Only '+g.words+' words — too short to be a real answer. In an interview this reads as thin. Say more.';
  else if(g.vb>0.3) sub+=' Heads up: a lot of that was word-for-word from the page, which usually means reading, not recalling.';

  if(startLag!==null){
    const sl=(startLag/1000).toFixed(1);
    sub += startLag<=1500
      ? ' You started straight away ('+sl+'s).'
      : ' It took you '+sl+'s to start talking after reading it'+(startLag>8000?' — that hesitation is the thing to shrink.':'.');
  }
  $('verdict').innerHTML=head+' <small>'+sub+'</small>';
  $('chips').innerHTML =
    (g.hit.length?'<h4>You covered</h4>'+g.hit.map(k=>'<span class="chip hit">'+k+'</span>').join(''):'')+
    (g.miss.length?'<h4>You missed</h4>'+g.miss.map(k=>'<span class="chip miss">'+k+'</span>').join(''):'');
  $('score').classList.add('on');
  lastCov=g.cov;
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog=null, listening=false, heard='', typing=false;

function setNote(msg){ const n=$('micnote'); n.style.display=msg?'block':'none'; n.innerHTML=msg||''; }

function startMic(){
  if(typing){ $('typed').focus(); return; }
  if(!SR){
    setNote('This browser has no speech recognition. Chrome or Edge has it — or use <b>Type it instead</b>.');
    showTyping(); return;
  }
  if(listening){ recog.stop(); return; }
  recog = new SR();
  recog.lang='en-US'; recog.continuous=true; recog.interimResults=true;
  heard='';
  recog.onstart=()=>{ listening=true; $('rec').classList.add('on'); $('talk').textContent='Stop and check'; setNote(''); };
  recog.onresult=e=>{
    let fin='', mid='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const t=e.results[i][0].transcript;
      if(e.results[i].isFinal) fin+=t+' '; else mid+=t;
    }
    if((fin+mid).trim()) noteStart();
    heard+=fin;
    $('said').innerHTML = heard + (mid?'<em>'+mid+'</em>':'') || '<em>listening…</em>';
    $('said').scrollTop=$('said').scrollHeight;
  };
  recog.onerror=e=>{
    listening=false; $('rec').classList.remove('on'); $('talk').textContent='Answer out loud';
    if(e.error==='not-allowed'||e.error==='service-not-allowed')
      setNote('The mic is blocked here. Download this file and open it in Chrome, then allow the mic — or use <b>Type it instead</b>.');
    else if(e.error==='no-speech') setNote('Did not catch anything. Try again, closer to the mic.');
    else setNote('Mic stopped: '+e.error+'. You can use <b>Type it instead</b>.');
    showTyping();
  };
  recog.onend=()=>{
    listening=false; $('rec').classList.remove('on'); $('talk').textContent='Answer out loud';
    if(heard.trim()) check();
  };
  try{ recog.start(); }
  catch(err){ setNote('Could not start the mic. Use <b>Type it instead</b>.'); showTyping(); }
}

function showTyping(){ typing=true; $('typed').classList.add('on'); $('type').style.display='none'; }

function check(){
  const said = typing ? $('typed').value : heard;
  showScore(grade(said));
  if(!revealed) reveal(true);
}

/* how long this question takes to read, ~200 wpm plus a beat to take it in */
function readingTime(q){
  const w=q.trim().split(/\s+/).length;
  return Math.round(500 + (w/200)*60000);
}
/* the clock only starts once you'd realistically have finished reading */
function beginRecall(){
  if(phase==='recall') return;
  phase='recall'; recallT0=Date.now();
  $('clock').classList.remove('reading'); $('clock').textContent='0:00';
  $('readfill').style.width='0%';
}
/* first sound out of your mouth stops the "how long to get going" measure */
function noteStart(){
  if(startLag!==null) return;
  const wasReading = phase==='read';
  beginRecall();
  startLag = wasReading ? 0 : Date.now()-recallT0;
}

  const lo=Math.min(a,b), hi=Math.max(a,b);          // typing them backwards still works
  pool=QA.filter(x=>(!sec||x.s===sec) && x.n>=lo && x.n<=hi);
  const c=$('count');
  c.textContent = pool.length ? pool.length+(pool.length===1?' question':' questions') : 'none in range';
  c.classList.toggle('none', pool.length===0);
  if(!pool.length){
    clearInterval(tick);
    $('q').textContent='No questions in that range. Widen it or clear the section filter.';
    $('sec').textContent=''; $('clock').textContent=''; $('voice').style.display='none';
    $('stage1').style.display='none'; $('stage2').style.display='none';
    $('a').classList.remove('on'); $('score').classList.remove('on'); $('hint').style.display='none';
    cur=null; return;
  }
  if(go) next();
}

$('filter').onchange=()=>applyFilters(true);
$('from').oninput=()=>applyFilters(true);
$('to').oninput=()=>applyFilters(true);
$('rall').onclick=()=>{ $('filter').value=''; $('from').value=1; $('to').value=NMAX; applyFilters(true); };

/* weight: missed questions come back sooner, ones you know fade out */
function pick(){
  const w=pool.map(x=>{
    const sc=st.score[x.n]||0;              // +1 knew, -1 missed, capped
    let v=Math.pow(2,-sc);                  // 1 by default, 2 when shaky, 0.5 when solid
    if(x.n===lastN) v*=0.05;                // avoid immediate repeat
    return v;
  });
  let r=Math.random()*w.reduce((a,b)=>a+b,0);
  for(let i=0;i<pool.length;i++){ r-=w[i]; if(r<=0) return pool[i]; }
  return pool[pool.length-1];
}

function fmt(ms){const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}

function next(){
  cur=pick(); lastN=cur.n; revealed=false;
  $('sec').textContent=cur.s;
  $('q').textContent=cur.q;
  $('a').textContent=cur.a; $('a').classList.remove('on'); $('a').scrollTop=0;
  $('hint').style.display='';
  $('stage1').style.display='flex'; $('stage2').style.display='none';
  heard=''; lastCov=null;
  if(listening && recog) { try{recog.stop()}catch(e){} }
  $('said').innerHTML='<em>Press the button, then say your answer as if the interviewer asked it.</em>';
  $('typed').value=''; $('score').classList.remove('on'); setNote('');
  $('voice').style.display='flex';
  readMs=readingTime(cur.q); phase='read'; startLag=null; recallT0=0;
  t0=Date.now(); clearInterval(tick);
  $('clock').classList.remove('slow'); $('clock').classList.add('reading');
  $('clock').textContent='reading · '+(readMs/1000).toFixed(1)+'s';
  $('readfill').style.width='100%';
  tick=setInterval(()=>{
    const e=Date.now()-t0;
    if(phase==='read'){
      $('readfill').style.width=Math.max(0,100-(e/readMs*100)).toFixed(1)+'%';
      if(e>=readMs) beginRecall();
      return;
    }
    const r=Date.now()-recallT0;
    $('clock').textContent=fmt(r);
    if(r>30000) $('clock').classList.add('slow');
  },100);
}

function reveal(afterCheck){
  if(revealed) return;
  noteStart();
  revealed=true; clearInterval(tick);
  $('a').classList.add('on'); $('hint').style.display='none';
  $('stage1').style.display='none'; $('stage2').style.display='flex';
  if(!afterCheck && listening && recog){ try{recog.stop()}catch(e){} }
}

function mark(ok){
  if(!revealed) return;
  const el=recallT0? Date.now()-recallT0 : Date.now()-t0;
  if(startLag!==null) st.lags=(st.lags||[]).concat(startLag).slice(-40);
  st.hist=(st.hist||[]).concat(ok?1:0).slice(-24);
  st.asked++; if(ok){st.hits++; st.times.push(el); st.streak++; st.best=Math.max(st.best,st.streak);}
  else st.streak=0;
  const s=st.score[cur.n]||0;
  // a checked answer under 60% coverage counts as shaky even if it felt fine
  const solid = ok && (lastCov===null || lastCov>=0.6);
  st.score[cur.n]=Math.max(-2,Math.min(3, solid? s+1 : s-1));
  st.times=st.times.slice(-40);
  save(st); render(); next();
}

function render(){
  $('s-asked').textContent=st.asked;
  $('s-rate').textContent=st.asked?Math.round(st.hits/st.asked*100)+'%':'—';
  $('s-time').textContent=st.times.length
    ? Math.round(st.times.reduce((a,b)=>a+b,0)/st.times.length/1000)+'s' : '—';
  const lg=st.lags||[];
  $('s-lag').textContent=lg.length? (lg.reduce((a,b)=>a+b,0)/lg.length/1000).toFixed(1)+'s' : '—';
  $('s-streak').textContent=st.streak;
  $('s-weak').textContent=Object.values(st.score).filter(v=>v<0).length;
  const hist=(st.hist||[]);
  $('ledger').innerHTML=Array.from({length:24},(_,i)=>{
    const v=hist[hist.length-24+i];
    return `<div class="cell ${v===1?'y':v===0?'n':''}"></div>`;
  }).join('');
}

$('reveal').onclick=()=>reveal(false);
$('talk').onclick=startMic;
$('check').onclick=check;
$('type').onclick=()=>{ showTyping(); $('typed').focus(); };
$('typed').addEventListener('input',()=>{ if($('typed').value.trim()) noteStart(); });
$('skip').onclick=next;
$('knew').onclick=()=>mark(true);
$('missed').onclick=()=>mark(false);
$('reset').onclick=()=>{
  if(!confirm('Clear your scores and start fresh?')) return;
  st={score:{},asked:0,hits:0,times:[],lags:[],streak:0,best:0,hist:[]}; save(st); render(); next();
};

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='SELECT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT') return;
  const k=e.key.toLowerCase();
  if(k===' '||k==='enter'){e.preventDefault(); if(!revealed) reveal(false);}
  else if(k==='v'){e.preventDefault(); startMic();}
  else if(k==='c'){e.preventDefault(); check();}
  else if(k==='k') mark(true);
  else if(k==='m') mark(false);
  else if(k==='s') next();
});

(async()=>{ const d=await load(); if(d) st={...st,...d}; render(); applyFilters(true); })();
</script>
