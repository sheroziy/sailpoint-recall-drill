<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --ink:#0E1826; --ink-2:#18263A; --line:#2A3B54;
  --paper:#F2F0EA; --paper-dim:#B9C2CE;
  --signal:#E8A33D; --yes:#4FB286; --no:#D9695F;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--sans);
     -webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto;padding:20px 20px 40px;min-height:100vh;display:flex;flex-direction:column;gap:14px}

/* header */
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--paper-dim)}
select{background:var(--ink-2);color:var(--paper);border:1px solid var(--line);border-radius:6px;
       padding:6px 8px;font-family:var(--mono);font-size:12px}

/* range picker */
.range{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
       font-family:var(--mono);font-size:11px;letter-spacing:.1em;
       text-transform:uppercase;color:var(--paper-dim)}
.range input{width:56px;background:var(--ink-2);color:var(--paper);border:1px solid var(--line);
             border-radius:6px;padding:6px 8px;font-family:var(--mono);font-size:12px;
             text-align:center;-moz-appearance:textfield}
.range input:focus{outline:2px solid var(--signal);outline-offset:1px}
.range button{flex:0 0 auto;min-width:0;padding:6px 10px;font-family:var(--mono);font-size:11px;
              font-weight:400;letter-spacing:.1em;text-transform:uppercase}
.range .count{color:var(--signal);margin-left:auto}
.range .count.none{color:var(--no)}

/* ledger: last 24 answers, like a certification row */
.ledger{display:flex;gap:3px;height:8px}
.cell{flex:1;background:var(--ink-2);border-radius:1px}
.cell.y{background:var(--yes)} .cell.n{background:var(--no)}

/* card */
.card{background:var(--ink-2);border:1px solid var(--line);border-radius:12px;padding:22px;
      display:flex;flex-direction:column;gap:18px;flex:1}
.meta{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);
      font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--paper-dim)}
.tag{color:var(--signal)}
.clock{font-variant-numeric:tabular-nums;font-size:13px;letter-spacing:.06em}
.clock.slow{color:var(--signal)}
.clock.reading{color:#7C879A;letter-spacing:.1em;text-transform:none}
.readbar{height:2px;background:var(--ink);border-radius:2px;overflow:hidden;margin-top:-8px}
.readbar i{display:block;height:100%;width:0%;background:#7C879A}
.q{font-family:var(--serif);font-size:clamp(21px,3.4vw,30px);line-height:1.3;margin:0}
.hint{font-size:13px;color:var(--paper-dim);line-height:1.55;max-width:52ch}
.hint b{color:var(--paper);font-weight:600}

.answer{display:none;border-top:1px solid var(--line);padding-top:16px;max-height:44vh;overflow:auto;
        white-space:pre-wrap;font-size:15px;line-height:1.62;color:#E4E1D8}
.answer.on{display:block}

/* controls */
.row{display:flex;gap:10px;flex-wrap:wrap}
button{font-family:var(--sans);font-size:15px;font-weight:600;border-radius:8px;padding:13px 18px;
       border:1px solid var(--line);background:var(--ink);color:var(--paper);cursor:pointer;flex:1;
       min-width:120px;transition:transform .06s ease,background .15s ease}
button:hover{background:#20304691}
button:active{transform:translateY(1px)}
button:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.primary{background:var(--signal);color:#22180A;border-color:var(--signal)}
.primary:hover{background:#F0B255}
.yes{border-color:var(--yes);color:var(--yes)} .yes:hover{background:#4FB2861f}
.no{border-color:var(--no);color:var(--no)} .no:hover{background:#D9695F1f}
kbd{font-family:var(--mono);font-size:11px;opacity:.65;font-weight:400}

.stats{display:flex;gap:18px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;
       letter-spacing:.1em;text-transform:uppercase;color:var(--paper-dim)}
.stats b{color:var(--paper);font-weight:600;font-size:13px;letter-spacing:0}
.reset{background:none;border:none;color:var(--paper-dim);font-size:11px;font-family:var(--mono);
       text-transform:uppercase;letter-spacing:.1em;cursor:pointer;padding:0;flex:0;min-width:0}
.reset:hover{color:var(--no);background:none}
/* voice */
.voice{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:12px}
.mic{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mic button{flex:0 0 auto;min-width:0}
.rec{width:10px;height:10px;border-radius:50%;background:var(--line);flex:0 0 auto}
.rec.on{background:var(--no);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.said{font-size:14px;line-height:1.55;color:var(--paper-dim);min-height:1.2em;
      max-height:22vh;overflow:auto;white-space:pre-wrap}
.said em{color:#8894A6;font-style:normal}
textarea{width:100%;background:var(--ink);color:var(--paper);border:1px solid var(--line);
         border-radius:8px;padding:12px;font-family:var(--sans);font-size:14px;line-height:1.5;
         resize:vertical;min-height:70px;display:none}
textarea.on{display:block}
.note{font-size:12px;color:var(--paper-dim);line-height:1.5}
.note a{color:var(--signal)}

/* score */
.score{display:none;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:16px}
.score.on{display:flex}
.bar{height:6px;background:var(--ink);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--signal);transition:width .5s ease}
.verdict{font-family:var(--serif);font-size:19px;line-height:1.35}
.verdict small{display:block;font-family:var(--sans);font-size:13px;color:var(--paper-dim);
               margin-top:5px;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:11px;letter-spacing:.04em;padding:5px 9px;border-radius:20px;
      border:1px solid var(--line);color:var(--paper-dim)}
.chip.hit{border-color:var(--yes);color:var(--yes)}
.chip.miss{border-color:var(--no);color:var(--no)}
.chips h4{width:100%;margin:2px 0 0;font-family:var(--mono);font-size:10px;letter-spacing:.14em;
          text-transform:uppercase;color:#7C879A;font-weight:500}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <div class="top">
    <span class="brand">SailPoint recall drill</span>
    <select id="filter" aria-label="Pick a section to drill"></select>
  </div>

  <div class="range">
    <label for="from">from Q<input id="from" type="number" inputmode="numeric" min="1" value="1"></label>
    <label for="to">to Q<input id="to" type="number" inputmode="numeric" min="1" value="85"></label>
    <button id="rall">whole set</button>
    <span class="count" id="count"></span>
  </div>

  <div class="ledger" id="ledger" aria-label="Your last 24 answers"></div>

  <div class="card">
    <div class="meta">
      <span class="tag" id="sec"></span>
      <span class="clock" id="clock">reading…</span>
    </div>
    <div class="readbar"><i id="readfill"></i></div>
    <h1 class="q" id="q">Loading…</h1>
    <p class="hint" id="hint">Say your answer out loud, then check it. The clock waits while you read, then times how long you take to get going.</p>
    <div class="voice" id="voice">
      <div class="mic">
        <span class="rec" id="rec"></span>
        <button id="talk">Answer out loud <kbd>V</kbd></button>
        <button id="type">Type it instead</button>
      </div>
      <div class="said" id="said"><em>Press the button, then say your answer as if the interviewer asked it.</em></div>
      <textarea id="typed" placeholder="Type your answer from memory, then check it."></textarea>
      <p class="note" id="micnote" style="display:none"></p>
    </div>

    <div class="score" id="score">
      <div class="bar"><i id="barfill" style="width:0%"></i></div>
      <p class="verdict" id="verdict"></p>
      <div class="chips" id="chips"></div>
    </div>

    <div class="answer" id="a"></div>

    <div class="row" id="stage1">
      <button class="primary" id="check">Check what I said <kbd>C</kbd></button>
      <button id="reveal">Show answer <kbd>space</kbd></button>
      <button id="skip">Skip <kbd>S</kbd></button>
    </div>
    <div class="row" id="stage2" style="display:none">
      <button class="yes" id="knew">I knew it <kbd>K</kbd></button>
      <button class="no" id="missed">I missed it <kbd>M</kbd></button>
    </div>
  </div>

  <div class="stats">
    <span>asked <b id="s-asked">0</b></span>
    <span>recalled <b id="s-rate">—</b></span>
    <span>avg start <b id="s-lag">—</b></span>
    <span>avg recall <b id="s-time">—</b></span>
    <span>streak <b id="s-streak">0</b></span>
    <span>shaky <b id="s-weak">0</b></span>
    <button class="reset" id="reset">reset progress</button>
  </div>
</div>

<script>
const QA = [{"n": 1, "q": "Authentication vs Authorization explain the difference?", "a": "While authentication is about verifying the identity of\nusers and confirming that they are who they claim to be,\nauthorization is about managing their access rights after\ntheir identity has been verified.", "k": ["authorization", "authentication", "confirming", "claim", "verifying"], "s": "General"}, {"n": 2, "q": "What are the major changes in SAILPOINT IDENTITY IQ Version 7 vs Version 8?", "a": "Some general enhancements and changes introduced in the transition:\nintroduced in the transition from SAILPOINT\nIDENTITY IQ 7 to 8 include:\nA. Improved User Interface: SAILPOINT IDENTITY IQ 8\nintroduced an improved, more user- friendly interface with\na modern look and feel. The redesigned UI aimed to\nimprove usability and navigation.\nB. Another major one is Enhanced Application\nOnboarding: With introduction of Dynamic Applications\nin 8, application onboarding became more simplified and\nflexible. This feature allows application owners to define\ntheir own schema for the application.", "k": ["reviewer", "schema", "introduced", "transition", "application"], "s": "General"}, {"n": 3, "q": "Do you understand Business Case and Use case?", "a": "Sure! A business case in the context of SAILPOINT\nIDENTITY IQ is essentially the justification for\nimplementing a particular identity management strategy\nor a specific functionality within SAILPOINT\nIDENTITY IQ. For instance, a company might create a\nbusiness case for implementing SAILPOINT IDENTITY\nIQ that includes reducing manual workload, improving\nsecurity compliance, increasing operational efficiency,\nand providing a centralized view of access rights.\nFor example, a business case might be: \"Implementing\nSAILPOINT IDENTITY IQ will provide a centralized\nview of all employees' access rights, streamlining the\nprocess of managing and revoking these rights. It will\nreduce the time and effort spent on manual access\ncertification processes, leading to cost savings. Moreover,\nSAILPOINT IDENTITY IQ's automation of access\nmanagement will improve the organization's compliance\nwith security policies and regulations.\"\nA use case, on the other hand, describes how a specific\nfeature or functionality of SAILPOINT IDENTITY IQ\ncan be used to achieve a particular goal.\nFor example, a use case might be: \"A HR personnel\ninitiates an onboard process for a new employee in the\nHR system. This triggers SAILPOINT IDENTITY IQ to\nautomatically create a new identity for the employee,\nassign the appropriate initial roles based on their job title,\nand provide access to the necessary applications. This\nautomated process eliminates manual tasks, reduces\nerrors, and ensures the new employee has the required\naccess on their first day of work.\"\nIn summary, a business case provides the justification for\nusing SAILPOINT IDENTITY IQ, while a use case\nprovides a detailed scenario of how SAILPOINT\nIDENTITY IQ can be used in a specific context to\nprovide value to the organization.", "k": ["business case", "use case", "Entra / Azure AD", "performance", "HR system", "certification", "deprovisioning", "compliance"], "s": "General"}, {"n": 4, "q": "What is the difference between Architect and Developer?", "a": "In SAILPOINT IDENTITY IQ, the Architect and\nDeveloper roles have different responsibilities and skill\nsets. An Architect generally designs the overall identity\nmanagement solution, focusing on aligning the technical\ndesign with business needs and integrating SAILPOINT\nIDENTITY IQ with the existing IT infrastructure. On the\nother hand, a Developer typically implements the solution\nbased on the design writes custom code for workflows or\nrules, configures the system, and troubleshoots issues. In\nsummary, the Architect designs the solution, and the\nDeveloper brings it to life.\nSAILPOINT IMPLEMENTATION", "k": ["architect vs developer", "troubleshooting", "customization", "workflow", "role"], "s": "General"}, {"n": 5, "q": "Have you implemented SAILPOINT IDENTITY IQ from the ground up in any of your projects?", "a": "Yes, in fact, my current project at XYZ company has\ninvolved a thorough implementation of SAILPOINT\nIDENTITY IQ from the ground up.\n• The first step is Planning and design:\no This involves identifying the organization's identity\nmanagement needs, defining the requirements for the\nSAILPOINT IDENTITY IQ implementation, and\ndesigning the SAILPOINT IDENTITY IQ solution.\n• Then Setup and Configuration:\no This involves setting up and configuring the SAILPOINT\nIDENTITY IQ environment, including the database,\napplication server, and other necessary components. This\nstep also includes configuring the SAILPOINT\nIDENTITY IQ application according to the organization's\nidentity management needs.\n• Once the Setup and Configuration is done, then:\no We need to connect SailPoint to our identity data sources,\nwhich can include systems like Active Directory (AD), HR\nsystems, databases, and more. This is done through\nconnectors provided by SailPoint, or you can develop\ncustom ones if necessary.\n• Once connected to data sources, the next step is:\no to configure identity and access management features\nsuch as Role Based Access Control (RBAC), Access\nReviews, Provisioning, and Password Management.\n• Then Role Modeling and Definition should be defined:\no For that we need to define roles based on the business and\nregulatory needs of your organization. This includes\nmapping roles to access privileges and defining role\nhierarchies.\n• The next step is Implement Provisioning Policies and\nWorkflows:\no We need to set up policies and workflows for automatically\nprovisioning and deprovisioning access based on role\nchanges, joiners/movers/leavers, etc.\n• After that need to Implement Access Certifications:\no For that we set up periodic access review processes to\nensure that users still have appropriate access.\n• Of course we can’t push anything forward without\nTesting:\no This includes functional testing, system integration testing,\nand UAT (User Acceptance Testing) to ensure the solution\nis working as expected.\n• Once all the testing complete, bugs are fixed and accepted\nby the users, it can be DEPLOYED to the production\nenvironment.", "k": ["Tomcat", "test environment", "RBAC", "joiner mover leaver", "Active Directory", "workflow", "testing", "connector"], "s": "Implementation"}, {"n": 6, "q": "Can you give some examples of the challenges you faced while implementing SAILPOINT IDENTITY IQ and how you overcame them?", "a": "Of course, in any projects you may run into some big or\nsmall challenges. When I was tasked with implementing\nSAILPOINT IDENTITY IQ in the past, I encountered\nseveral challenges due to the complex nature of identity\nmanagement and the need for extensive integration with a\nvariety of systems. For example:\n• One of the challenges was Integration with Diverse\nSystems, where integrating SAILPOINT IDENTITY IQ\nwith various applications and platforms within the “XYZ”\norganization. These included legacy systems, modern\ncloud-based applications, and different databases. The\ndifferent data structures and APIs made integration\nintricate. However, by thoroughly understanding the APIs\nand data structures of each system, we were able to\nleverage SAILPOINT IDENTITY IQ’s out of the box\nconnectors where possible. For systems without existing\nconnectors, we developed custom connectors.\n• Another big one was with Legacy Systems, for example,\nOracle EBusiness Suite.\nOracle EBS is a suite of business applications for\nmanaging core business processes. We used SAILPOINT\nIDENTITY IQ's Oracle EBusiness Suite connector to\nonboard EBS. This involved mapping EBS user and\nresponsibility data into SAILPOINT IDENTITY IQ,\nwhich allowed us to manage EBS access controls, perform\naccess reviews, and handle account provisioning and\ndeprovisioning from SAILPOINT IDENTITY IQ.\n• And nowadays the challenges with Modern Cloud Based\nApplications.\nLet’s say Salesforce! Salesforce is a widely used\ncustomer relationship management tool. For Salesforce,\nwe utilized SAILPOINT IDENTITY IQ's Salesforce\nConnector. This allowed us to pull in users and access\ndata from Salesforce, manage Salesforce roles and\npermissions from SAILPOINT IDENTITY IQ, and\ninclude Salesforce data in access reviews. This was a\ncomplex process due to the customization often present in\nSalesforce implementations, but the flexibility of\nSAILPOINT IDENTITY IQ's connector allowed us to\nhandle this effectively.\n• Also, the Data Consistency: Another hurdle was ensuring\nconsistency of user identity data across all systems. Due to\nvarying ways systems store and manage user data,\ninconsistencies could emerge when data was consolidated\nin SAILPOINT IDENTITY IQ. To address this, we\nstandardized the identity data during the aggregation\nprocess, which often required creating custom rules to\ntransform data as it was imported into SAILPOINT\nIDENTITY IQ.\no Within the Data Consistency issues there is Identity\nDuplication. If the same user has different usernames in\ndifferent systems, it might result in duplication of identities\nwhen the data is consolidated in SAILPOINT IDENTITY\nIQ. For example, if a user 'John Doe' has a username 'jdoe'\nin one system and 'john.doe' in another, SAILPOINT\nIDENTITY IQ could consider them as two separate\nidentities during the aggregation process.\no Also, Inconsistent Terminology. Different systems\nmight use different terms for the same concept. For\nexample, what one system calls 'groups', another might\ncall 'roles'. This could lead to confusion when data is\nconsolidated, affecting role-based access control in\nSAILPOINT IDENTITY IQ.\n• Another one I can talk about is Role Definition.\nAccurately defining roles based on an employee's job\nfunction and access needs proved challenging.\nInadequately defined roles could lead to either excessive\npermissions or insufficient access. To mitigate this, we\ncollaborated with stakeholders from each department to\ndefine meaningful roles, and routinely reviewed and\nadjusted these roles to ensure their accuracy as the\ncompany evolved.\no Redundant roles happen when there are multiple roles\nwith overlapping permissions. For instance, if there are\nseparate roles for \"Sales Rep\" and \"Sales Associate\" that\ngrant access to the same resources, it can lead to confusion\nand unnecessary complexity.\no Outdated Roles! Over time, as an organization changes,\nsome roles may become outdated. For instance, a role\nmight have been created for a specific project that has since\nbeen completed, or for a position that no longer exists in\nthe organization.\no Performance: The high volumes of data processed by\nSAILPOINT IDENTITY IQ often impacted the system's\nperformance. Regular identity refresh tasks, access\nreviews, and other processes could burden the system. We\nenhanced performance by optimizing SAILPOINT\nIDENTITY IQ configurations, regularly monitoring\nsystem performance, and scheduling heavy tasks during\noff peak times.\nTo prevent such scenarios, we established a High\nAvailability (HA) infrastructure composed of three\ndatabase servers, three task servers, and two user\ninterface servers.\n• User Adoption: During the implementation of\nSAILPOINT IDENTITY IQ, user adoption posed a\nsignificant challenge due to resistance to change and\nconcerns over the complexity of the new system. To\novercome this, we launched an extensive training\nprogram to familiarize users with SAILPOINT\nIDENTITY IQ and highlighted its advantages, such as\nexpedited request processing, enhanced access tracking,\nand bolstered security. Additionally, a dedicated helpdesk\nwas established to address user queries and issues during\nthe transition. Over time, as users became familiar with\nSAILPOINT IDENTITY IQ, the resistance dwindled,\nresulting in increased efficiency, transparency, and user\nsatisfaction.\nEach of these challenges was a valuable learning\nexperience, providing a deeper understanding of\nSAILPOINT IDENTITY IQ and its effective\nimplementation in various environments.\nEXPERIENCE WITH OTHER IDM\nTOOLS", "k": ["downtime", "legacy systems", "Salesforce", "custom connector", "RBAC", "custom rule", "stakeholders", "training / adoption"], "s": "Implementation"}, {"n": 7, "q": "Have you worked on any other IDM tools?", "a": "Besides my hands-on experience with SailPoint, I've\ngotten my feet wet with Oracle IDM, I am also familiar\nwith ForgeRock.\n• With Oracle IDM, I was heavily involved with it in a\n\"XYZ\" project. My duties there weren't just limited to the\nbasics like creating and managing user accounts or\nprovisioning resources. It went deeper than that. I set up\nworkflows for automated approval processes, dabbled in\nsecurity by managing access control and privileges... you\nname it. But what I especially loved about it was Oracle\nIDM’s comprehensive auditing and reporting features. I\nused them a lot to make sure all access and activities were\nup to par with our security protocols. Helped me sleep\nbetter at night, knowing everything was secure.\n• Now, talking about ForgeRock, that's another interesting\nchapter. It was during another \"XYZ project\" when I really\ndug into ForgeRock's wide range of tools for digital\nidentity management. Again, my work wasn't just about\nadministering end-user identities and managing access\nprivileges. I got to set up Single Sign On (SSO)\ncapabilities, configure multi factor authentication to beef\nup our security.", "k": ["ForgeRock", "MFA", "SSO", "authentication", "Oracle", "approval", "workflow", "provisioning"], "s": "Other IDM tools"}, {"n": 8, "q": "How would you compare your experiences working with Oracle IDM, ForgeRock, and SAILPOINT IDENTITY IQ?", "a": "I've had a pretty interesting journey working with Oracle\nIDM, ForgeRock, and SAILPOINT IDENTITY IQ, and\neach one has really brought something different to the\ntable when it comes to identity management.\n• So, let’s take Oracle IDM for instance. If you're already\nfamiliar with Oracle and use a lot of their products, it's a\nfantastic option. It's really a powerhouse with a great range\nof features and it works smoothly with other Oracle\nProducts.\n• Then you've got ForgeRock. Now, what I love about\nForgeRock is just how adaptable it is. If you're dealing with\nconsumer identity management, this is your go to. It can\nreally grow with your business needs and offers so much\nflexibility, which I think is super important in today's\ndynamic business environment.\n• And then there's SailPoint. This is a solution I've spent a\ngood amount of time with, and let me tell you, it's\nsomething else. The way SAILPOINT IDENTITY IQ\nplatform manages to blend compliance controls, access\ncertifications, and user provisioning all into one neat\npackage is something that's really made a difference in\ncomplex enterprise environments. It really stands out in the\nIdentity and Access Management (IAM) field with its\nunique approach.", "k": ["ForgeRock", "Oracle", "certification", "compliance", "provisioning"], "s": "Other IDM tools"}, {"n": 9, "q": "Have you migrated from Oracle IDM to SAILPOINT IDENTITY IQ?", "a": "So, I had this experience on my \"XYZ project\" where I\nmigrated from Oracle IDM to SAILPOINT IDENTITY\nIQ. I'll tell you, it was quite a journey, but very rewarding\nin the end.\n• First things first, we got to understand the current Oracle\nIDM setup from A to Z. We're talking user roles, groups,\naccess rules, workflows all the bits and pieces that make\nthe system work.\n• Once we've got that down, it's time to play matchmaker.\nWe need to figure out what in Oracle IDM corresponds to\nwhat in SAILPOINT IDENTITY IQ.\n• Now, the real work begins moving day! We've got to pack\nup all our user data, roles, groups, and permissions, and\nmove them from Oracle IDM over to their new home in\nSAILPOINT IDENTITY IQ. This involved a lot of\nscripting and using ETL tools to make sure everything was\nin a format that SAILPOINT IDENTITY IQ could\nunderstand.\n• We also had to think about all the connections that Oracle\nIDM had with other systems in our environment.\nSAILPOINT IDENTITY IQ has a lot of ready to use (out\nof the box) connectors, but it's also flexible enough to let\nus build custom integrations which we’ve done quite a bit.\n• Next, we went into test mode. We had to check that all our\nmigrated data and integrations were working properly in\nSAILPOINT IDENTITY IQ.\n• And of course, there's always that learning curve when you\nintroduce a new system. We had to ensure our end users\nand admins were trained up on how to navigate and use\nSAILPOINT IDENTITY IQ.\n• When we felt ready, we started the rollout. Given the size\nof our organization, we didn't want to dive in headfirst. So,\nwe started off with a pilot group, testing the waters before\ngoing for a full-blown launch.\n• And finally, after the migration was complete, we shifted\ninto a support and monitoring mode. We had to keep an\neye on the system, provide user support, and tweak things\nbased on the feedback we got. Monitoring and support\nwere the final pieces of the puzzle that ensured a successful\nmigration.", "k": ["pilot rollout", "training / adoption", "out-of-the-box connector", "migration", "Oracle", "workflow", "testing", "connector"], "s": "Other IDM tools"}, {"n": 10, "q": "What were the key factors you had to consider during the migration process?", "a": "So, I have done that from Oracle to the SAILPOINT\nIDENTITY IQ those are mine hands-on experience that I\ncan recall at the recently, so there is the key factors that\nwe had to consider during the Migration process.\n• One of them I would say the Downtime Minimization:\nEnsuring that the migration process caused the least\namount of disruption to business operations was a critical\nfactor. Planning the migration during nonpeak hours or\ntimes of low system use can help achieve this.\n• Another one is the Data Integrity: The preservation and\naccuracy of data during migration was a top priority. We\nperformed several data integrity checks before, during, and\nafter the migration to ensure no data was lost, corrupted, or\naltered inappropriately.\n• Another one is a Security: Ensuring the security of data\nduring transit and at the new location was vital. We used\nencrypted protocols for data transfer and established robust\nsecurity measures (like firewalls, intrusion detection\nsystems) at the new location", "k": ["encryption", "downtime", "data integrity", "migration", "Oracle"], "s": "Other IDM tools"}, {"n": 11, "q": "How did you perform the Data Integrity for migration?", "a": "Pre-Migration check:\n• I started off by creating a nifty inventory of all the existing\ndata we have. I'm talking about users, roles, entitlements,\napplication definitions, and all those other components that\nSailPoint takes care of.\n• On top of that, I took a deep dive to validate our current\ndata. I've been on the hunt for anything odd or out of place,\nanything that could potentially throw a wrench in our\nmigration plans. We're talking about things like wonky role\ndefinitions, users who somehow have multiple accounts, or\nentitlements that aren't tied to any roles or users.\n• I've been making good use of the reporting and auditing\ntools within SailPoint to generate this data. This detailed\npre migration check will act as our yardstick to measure\nthe post migration results and to make sure we don't lose\nany data in the process.\nBacking up the data:\nBefore we got the migration ball rolling, I made sure to\nhave a complete, UpToDate backup of all our data.\nConsider this our insurance policy in case anything goes\nsideways during the migration.", "k": ["backup", "data integrity", "migration", "entitlement", "role"], "s": "Other IDM tools"}, {"n": 12, "q": "What is the difference between IDP (OKTA, AD, LDAP) and IDM/IGA (SAILPOINT IDENTITY IQ)?", "a": "Identity Providers (IDP) provides and verifies user\nidentities, while an IDM solution manages what those\nidentities are allowed to do once authenticated. They\nwork together as part of a complete identity and access\nmanagement strategy.", "k": ["identity provider", "authentication", "verifies", "providers", "together"], "s": "Other IDM tools"}, {"n": 13, "q": "Can you elaborate on how these technologies work together?", "a": "IDP or Identity Providers like OKTA, Active Directory\n(AD), and LDAP provide user authentication services.\nThey confirm a user's identity and provide them with\naccess tokens. IDM or Identity Management like\nSAILPOINT IDENTITY IQ goes a step further by\nmanaging the entire lifecycle of digital identities. It\nincludes provisioning and deprovisioning of user access,\nrole management, access reviews, and compliance\nreporting. The IDM and IDP work in conjunction. The\nIDM uses the IDP for authentication while it manages the\naccess rights.", "k": ["API key / token", "Okta", "identity provider", "authentication", "Active Directory", "certification", "deprovisioning", "compliance"], "s": "Other IDM tools"}, {"n": 14, "q": "When OKTA is used as SSO on SAILPOINT IDENTITY IQ what is IDP on OKTA?", "a": "When OKTA is used as Single Sign On (SSO) on\nSAILPOINT IDENTITY IQ, the Identity Provider (IDP)\non OKTA is typically Active Directory (AD). An Identity\nProvider refers to a system entity that creates, maintains,\nand manages identity information for principals while\nproviding authentication services to relying on\napplications within a federation or distributed network.\nHowever, as far as I know, OKTA is quite versatile and\ncan use various other systems as IDPs, depending on the\nspecific configurations and needs of the organization. I\nthink, while Active Directory may be used as the IDP in\nmany cases, it is not the only possible IDP for OKTA", "k": ["SAML / OAuth", "Okta", "SSO", "identity provider", "authentication", "Active Directory"], "s": "Other IDM tools"}, {"n": 15, "q": "Can you describe any challenges faced when integrating OKTA as an SSO with SAILPOINT IDENTITY IQ, and how did you overcome them?", "a": "In our \"XYZ project' we used OKTA as Single Sign On\n(SSO) on SAILPOINT IDENTITY IQ, and the Active\nDirectory was used as IDP on OKTA. AD authenticated\nthe user identities, and these were then federated to\nOKTA, which in turn provides SSO services for\nSAILPOINT IDENTITY IQ. The challenges in this setup\narose from misconfiguration of SSO settings and AD\nconnection.\nWe had to configure OKTA with SAILPOINT\nIDENTITY IQ and ensure that the AD identity provider is\ncorrectly set up. We found that Users may not be synced\ncorrectly, causing access issues and we manually\nreconciled accounts to ensure each user has the\nappropriate access. Also, by systematic troubleshooting\nand examining log files we also found that when\nconfiguring SSO, user roles and permissions were not\nmapped correctly between systems, and we carefully\nplanned how roles in our identity provider map to roles in\nSAILPOINT IDENTITY IQ.", "k": ["reconciliation", "SAML / OAuth", "Okta", "SSO", "identity provider", "authentication", "logs", "troubleshooting"], "s": "Other IDM tools"}, {"n": 16, "q": "Have you worked with MS Entra, and how?", "a": "Yes, I was part of the POC project, where we tried to\nimplement MS Entra ID as the IAM service, but MS\nEntra ID is a cloud-based IAM service primarily focused\non providing identity and access management for\nMicrosoft-centric environments, while SAILPOINT\nIDENTITY IQ is a comprehensive IAM platform suitable\nfor managing identities, access, and governance across\ndiverse IT ecosystems, including both Microsoft and non-\nMicrosoft technologies. Our company decided to stick\nwith the SAILPOINT IDENTITY IQ as the IAM\nplatform.", "k": ["Entra / Azure AD", "cloud vs on-prem", "microsoft", "service", "platform"], "s": "Other IDM tools"}, {"n": 17, "q": "Have you integrated Microsoft Entra ID (Azure AD) with SailPoint?", "a": "Yes, I have integrated Microsoft Entra ID (Azure AD)\nand SAILPOINT IDENTITY IQ and I’ve done the\nfollowing:\n1. User Provisioning and Synchronization:\n- I’ve configured SAILPOINT IDENTITY IQ to\nsynchronize user accounts, groups, and attributes from\nMicrosoft Entra ID. This ensures that user information\nremains consistent across both platforms.\n- Changes made in Microsoft Entra ID, such as user\nadditions, updates, or deletions, can trigger corresponding\nactions in SAILPOINT IDENTITY IQ to keep identity\ndata up-to-date.\n2. Role and Entitlement Management:\n- SAILPOINT IDENTITY IQ provided advanced role and\nentitlement management functionality, allowing\norganizations to define and manage roles, entitlements, and\npermissions across their IT landscape.\n- Microsoft Entra ID's group-based access control can be\nsynchronized with SAILPOINT IDENTITY IQ to\nfacilitate role assignments and entitlement provisioning\nbased on users' group memberships in Microsoft Entra ID\nSAILPOINT APPLICATION\nONBOARDING", "k": ["Entra / Azure AD", "data consistency", "Active Directory", "entitlement", "provisioning", "role"], "s": "Other IDM tools"}, {"n": 18, "q": "Can you walk through the SAILPOINT APPLICATION ONBOARDING process?", "a": "When onboarding an application into SailPoint, I\nusually follow a structured requirement-\ngathering process.\n• First, I start by identifying business needs —\nunderstanding why the application is being\nonboarded, whether for compliance, automation, or\nreducing IT overhead, and engaging the right\nstakeholders like IT, security, and business owners.\n• Next, I define the scope by categorizing the\napplication based on its criticality, user base, and\nregulatory impact. I also check integration\ncapabilities — for example, whether the application\nsupports APIs, SCIM, REST, or existing connectors.\n• Then I move on to technical details documenting\naccess methods, reviewing authentication and\nauthorization models like SAML or OAuth, and\nanalyzing how identities and entitlements are\nstructured in the system.\n• From there, I map identities and entitlements by\nidentifying key attributes such as employee ID or\nusername, building an entitlement inventory, and\nclarifying ownership and lifecycle processes.\n• I also look at compliance and governance\nrequirements, making sure the application meets\nregulatory standards and that we have the right audit\nand reporting in place.\n• In terms of security and data protection, I assess\ndata sensitivity and ensure policies such as MFA or\npassword rules are followed.\n• After that, I define integration and automation\nprocesses — provisioning, deprovisioning, approval\nworkflows, and I make sure integration testing is\nplanned to validate everything.\n• Once that’s set, I focus on documentation and\ntraining so admins and end users understand the\nnew processes.\n• Finally, I prepare an implementation plan,\nincluding project timelines, resources, and risk\nmitigation, and establish a continuous review\nprocess with feedback loops and periodic\ncompliance checks.\nThis systematic approach helps ensure the\nonboarding is smooth, compliant, and aligned with\nboth business and security needs", "k": ["requirements gathering", "MFA", "SAML / OAuth", "SCIM", "authorization", "data integrity", "stakeholders", "training / adoption"], "s": "App onboarding"}, {"n": 19, "q": "What is the Source of Truth?", "a": "In SAILPOINT IDENTITY IQ, the term \"source of truth\"\nrefers to the authoritative data source that provides the\nmost accurate and UpToDate information about identities\nwithin an organization. This concept is crucial in identity\nmanagement and governance, as it ensures that the system\nhas reliable data to base its decisions and actions on.\nHere's a bit more detail:\n● Definition of Source of Truth: In the context of\nSAILPOINT IDENTITY IQ, a source of truth is typically\na system or database that holds the definitive set of\ninformation about users' identities, roles, and access\nprivileges. This could be an HR system, an Active\nDirectory, a LDAP directory, or any other authoritative\nsystem that the organization uses to manage employee\ninformation.\n● Role in Identity Management: SAILPOINT IDENTITY\nIQ uses this source of truth as the primary reference for\nmanaging user identities across various applications and\nsystems within an organization. It ensures consistency and\naccuracy in identity information, which is essential for\neffective access management, policy enforcement, and\ncompliance.\n● Aggregation and Synchronization: SAILPOINT\nIDENTITY IQ aggregates data from the source of truth and\npotentially other systems to build a comprehensive view of\neach user's identity and access rights. It also synchronizes\nthis information across different systems and applications,\nensuring that changes in the source of truth are reflected\nthroughout the organization's IT environment.\n● Importance for Compliance and Security: Having a\nreliable source of truth is critical for maintaining security\nand compliance with regulatory requirements. It allows\norganizations to accurately manage user access, conduct\naudits, and ensure that the right people have the right\naccess to the right resources.\nIn summary, the source of truth in SAILPOINT\nIDENTITY IQ is the cornerstone for identity governance\nand administration, providing a reliable and accurate\nfoundation for all identity related processes and decisions.", "k": ["source of truth", "data consistency", "Active Directory", "HR system", "aggregation", "compliance", "role"], "s": "App onboarding"}, {"n": 20, "q": "How many applications have you onboarded in SAILPOINT IDENTITY IQ?", "a": "So, in my current role, we've brought on over 200\napplications in total. I've personally been hands- on with\nthe applications that utilize JDBC, AD, and SAP. It's been\na diverse mix of software, everything from ERP systems\nto financial applications to HR platforms.\nJust to give you a bit more insight: I've worked with\nPeopleSoft, then there's Workday, a software for human\ncapital management and financial management. SAP\nSuccessFactors was another one on the list.\nI also worked with Salesforce. SAP ERP was another big\none, a core suite for a variety of business processes and\napplications. Oracle Financials was part of my remit too,\nand I also dealt with Xero, an accounting software. And\nfinally, we can't forget the good old OnPrem AD. So,\nyeah, that's a bit of a roundup of my experience with\nonboarding applications in SAILPOINT IDENTITY IQ.", "k": ["JDBC", "SAP", "Salesforce", "cloud vs on-prem", "Oracle", "Active Directory", "HR system", "role"], "s": "App onboarding"}, {"n": 21, "q": "What were some unique challenges you faced during the onboarding process?", "a": "There were a handful of unique hurdles we had to\novercome during the onboarding process.\n● First off, it was a bit of a struggle trying to integrate with\nolder applications. You know, the kind that were built\nbefore modern APIs or were simply not designed for\nintegration in the first place.\n● Then, we also had to wrestle with some applications that\ndidn't follow standard attribute naming conventions.\n● And let's not forget about the systems with huge user bases\nand a ton of access rights. It was quite the task to manage\nall that data and ensure proper access controls, but hey, we\ntook it one step at a time and successfully completed it.", "k": ["legacy systems", "data consistency", "web services / REST", "first", "wrestle"], "s": "App onboarding"}, {"n": 22, "q": "Provide details on configuring connectors you used in onboarding the applications to SAILPOINT IDENTITY IQ (JDBC).", "a": "used in onboarding the applications to\nSAILPOINT IDENTITY IQ (JDBC).\nOne of the applications I can give an example is\nPeopleSoft HCM: PeopleSoft uses Oracle, SQL Server,\nor other JDBC compliant databases.\nDefining the Connector: I created a new application\nwithin IIQ and selected the JDBC connector from the list\nof available connectors. I provided the necessary\nconnection details such as JDBC URL, driver, username,\nand password. I had to install the necessary JDBC driver\nas it wasn't already present.\nConfiguring the Schema: I defined the database schema\nwithin the connector configuration. This schema\ninstructed IIQ on how to read data from and write data to\nthe database. It included table names, column names, data\ntypes, and the relationships between tables.\nMapping Attributes: I mapped the application's identity\nattributes (like userID, firstName, lastName, email, etc.)\nto the corresponding attributes in SAILPOINT\nIDENTITY IQ. This mapping defined how data from the\napplication would be represented in SAILPOINT\nIDENTITY IQ.\nConfiguring Capabilities: Depending on the connector, I\nwas able to configure different capabilities like password\nsynchronization, provisioning, or deprovisioning.\nAggregation: Once the application was properly\nconfigured, I ran an aggregation task. Aggregation was\nthe process of pulling data from the application into\nSAILPOINT IDENTITY IQ. This was often done as a\nbatch process on a schedule (like nightly), but it could\nalso be event driven.", "k": ["JDBC", "scheduled task", "attribute mapping", "schema", "Oracle", "HR system", "aggregation", "connector"], "s": "App onboarding"}, {"n": 23, "q": "If during the application onboarding aggregation one of your custom rules is not working, how would you debug it?", "a": "1. Check the Aggregation Task Results. Problem might be\nvery basic or obvious.\n2. Use Advanced Analytics and search for the syslogs.\n3. Debug the rule and test it in SailPoint’s own Debug page\nor use IDE Tool like IntelliJ with Debuggers.\n4. Exception Handling Analysis: Set breakpoints within your\ncode at specific points to pause execution and inspect\nvariables or log statements.\n5. Logging Enhancements. Use Tomcat’s CatalinaOut log\nfile in log folder to check for the issues. Log level can be\nchanged from Tomcats Logging Configuration to Debug\nor Trace so it will generate detailed logs.", "k": ["IntelliJ", "Tomcat", "debug page", "analytics / risk", "error handling", "logs", "troubleshooting", "testing"], "s": "App onboarding"}, {"n": 24, "q": "Explain Web Service onboarding?", "a": "Web Service onboarding in the context of Identity and\nAccess Management (IAM) is the process of integrating\nweb-based applications or services into an IAM platform\nlike SAILPOINT IDENTITY IQ. It involves defining\nhow SAILPOINT IDENTITY IQ will connect to,\ncommunicate with, and manage user access for those web\nservices.\nSome key steps typically involve:\n● Setting up a connector or custom integration in\nSAILPOINT IDENTITY IQ that uses web service\nprotocols (like REST or SOAP) to communicate with the\nweb service.\n● Mapping the web service's user data and access rights to\nSAILPOINT IDENTITY IQ's identity model and access\nmodel.\n● Configuring regular data aggregation tasks to keep\nSAILPOINT IDENTITY IQ's data up to date with any\nchanges on the web service.\n● Setting up provisioning policies if SAILPOINT\nIDENTITY IQ will be used to grant, update, or revoke user\naccess on the web service.\n● Testing the setup thoroughly to ensure reliable operation.\nOverall, web service onboarding allows SAILPOINT\nIDENTITY IQ to centrally manage user identities and\naccess for web-based applications or services, enabling\nstreamlined access management, improved security, and\nefficient compliance processes.", "k": ["Entra / Azure AD", "web services / REST", "testing", "aggregation", "connector", "deprovisioning", "compliance"], "s": "App onboarding"}, {"n": 25, "q": "Have you integrated with ServiceNow? If yes, explain the process?", "a": "Yes, I have integrated with ServiceNow. The process\ninvolves setting up ServiceNow as an application in\nSAILPOINT IDENTITY IQ. We use the ServiceNow\nconnector provided by SAILPOINT IDENTITY IQ to\nestablish the connection.\nThe process involves mapping the user attributes between\nSAILPOINT IDENTITY IQ and ServiceNow,\nconfiguring the provisioning and deprovisioning\nworkflows, and setting up any necessary custom rules or\npolicies. This allows us to manage ServiceNow user\nidentities, access rights, and groups from within\nSAILPOINT IDENTITY IQ, enabling automated\nprovisioning, deprovisioning, and access review\nprocesses.", "k": ["ServiceNow", "custom rule", "workflow", "connector", "certification", "deprovisioning", "provisioning"], "s": "App onboarding"}, {"n": 26, "q": "Have you worked with APIs?", "a": "Yes, I've worked extensively with the SAILPOINT\nIDENTITY IQ API suite. These APIs are powerful tools\nthat allow for integration and interaction with external\nsystems. For instance, I've utilized them to automate\ncertain processes, integrate SAILPOINT IDENTITY IQ\nwith other systems in our infrastructure, and create\ncustom functionalities. My work often involved both\nRESTful and SOAP APIs. I ensured they were used\nsecurely and effectively to enhance our identity\nmanagement capabilities.", "k": ["web services / REST", "interaction", "extensively", "enhance", "worked"], "s": "App onboarding"}, {"n": 27, "q": "Could you share an example where a custom connector had to be built and why?", "a": "In one of my past projects, we were implementing\nSAILPOINT IDENTITY IQ for a client who had a\nproprietary ERP, inhouse application that was critical to\ntheir operations. This application was not supported by\nany of the out of the box connectors provided by\nSAILPOINT IDENTITY IQ.\nThe inhouse application had a unique structure and an\nunconventional way of managing user access and\npermissions, which posed a challenge. Without the ability\nto manage identities and access for this application, the\nSAILPOINT IDENTITY IQ implementation wouldn't\nfully meet the client's needs.\nTo address this, I worked closely with my team to\ndevelop a custom connector. We first analyzed the\napplication's architecture, API documentation, and access\ncontrol mechanisms. After understanding the application's\nunderlying framework, we then used SAILPOINT\nIDENTITY IQ's Connector Development Kit (CDK) to\ncreate a custom connector that could interact with the\napplication's APIs.\nThe custom connector enabled SAILPOINT IDENTITY\nIQ to fetch identity and access data from the inhouse\napplication, and provision and deprovision access.\nThrough iterative testing and refinement, we ensured that\nthe custom connector worked seamlessly with\nSAILPOINT IDENTITY IQ and was able to manage\nidentities and access for the inhouse application as\neffectively as the standard connectors did for other\napplications.", "k": ["architect vs developer", "custom connector", "out-of-the-box connector", "documentation", "web services / REST", "testing", "connector", "entitlement"], "s": "App onboarding"}, {"n": 28, "q": "What is the difference between Full Aggregation and Delta Aggregation?", "a": "Full and Delta Aggregations. Full Aggregation is a\ncomprehensive sync process involving all identity and\naccount data, typically used during initial setup, major\nsystem changes, or less frequently scheduled updates.\nDelta Aggregation is a faster, more resource efficient\nprocess that only syncs new or altered data, commonly\nused for regular, ongoing updates.\nThe choice between Full and Delta largely depends on the\norganization's specific requirements and resources.", "k": ["full aggregation", "delta aggregation", "aggregation"], "s": "App onboarding"}, {"n": 29, "q": "What is an access profile and how is it used?", "a": "An access profile, also known as a role or entitlement, is a\ncollection of access rights or permissions that can be\nassigned to users. It's a way to group together various\naccess rights that are typically required for specific job\nfunctions or roles within an organization.\nThe use of access profiles streamlines the process of\nmanaging access rights, as it allows for the bulk\nassignment and revocation of a predefined set of access\nrights, rather than having to manage each right\nindividually.\nHere are some ways access profiles are used:\n● Role Based Access Control (RBAC): This is the primary\nuse of access profiles. In RBAC, permissions are\nassociated with roles, and users are assigned appropriate\nroles based on their job function. For example, a \"Finance\nManager\" access profile might include access to financial\nsoftware, certain network locations, and specific document\nrepositories.\n● Efficient Onboarding and Offboarding: When new\nemployees join, the appropriate access profiles can be\nassigned based on their role, ensuring they have the tools\nand access necessary to perform their job from day one.\nSimilarly, when an employee leaves the organization or\nchanges roles, their old access profiles can be removed in\none action.\n● Improved Security and Compliance: By using access\nprofiles, organizations can ensure that users only have\naccess to what they need for their roles (the principle of\nleast privilege). It also makes auditing and reporting easier,\nas administrators can easily see who has access to what\nbased on the assigned access profiles.\n● Automated Provisioning and Deprovisioning: Many\nIAM solutions can automate the process of assigning and\nremoving access profiles based on triggers such as changes\nin the HR system, improving efficiency and reducing the\nrisk of human error.\n● Access Review and Certification: Access profiles\nsimplify the process of reviewing user access for\nappropriateness and compliance purposes.\nIn SAILPOINT IDENTITY IQ, access profiles are\nreferred to as \"Roles\" and can be created, managed, and\nassigned to identities within the system.", "k": ["access profile", "least privilege", "remediation", "RBAC", "documentation", "HR system", "entitlement", "certification"], "s": "App onboarding"}, {"n": 30, "q": "Have you done any application reconfiguration?", "a": "In SAILPOINT IDENTITY IQ, application configuration\nis pivotal for managing identity data from various\nsystems. When one of our systems transitioned from DB2\nto MongoDB, I was presented with the challenge of\nadjusting its integration with SAILPOINT IDENTITY\nIQ. However, to ensure continuity and leverage existing\nprocesses, I opted for an application reconfiguration\ninstead of a full-scale onboarding.\nI started by accessing the application's configuration\nwithin SAILPOINT IDENTITY IQ and navigated to the\nconnector settings. The connector type, previously set to\nDB2, was updated to match MongoDB specifications.\nDuring this process, I had to adjust the connection\nparameters, ensuring they pointed to the correct\nMongoDB instance, port, and credentials.\nThe schema mapping, which determines how data fields\nin MongoDB correspond to identity attributes in\nSAILPOINT IDENTITY IQ, required attention. I\nreevaluated and modified attribute mappings to align with\nthe MongoDB schema. Thankfully, SAILPOINT\nIDENTITY IQ's intuitive interface made remapping\nstraightforward, allowing me to drag and drop or\nmanually align fields as necessary. I then tested the\nrevised configuration by running a manual aggregation\ntask. This allowed me to verify that SAILPOINT\nIDENTITY IQ could successfully pull data from\nMongoDB and that the identity attributes were being\npopulated correctly.\nFinally, to ensure long term stability, I scheduled a series\nof delta aggregations to frequently capture changes from\nMongoDB. This ensured that SAILPOINT IDENTITY\nIQ's identity data remained UpToDate with the new\ndatabase.\nI smoothly transitioned the integration from DB2 to\nMongoDB without the need for re onboarding, thereby\nsaving time and ensuring consistency in our identity\ngovernance processes.", "k": ["delta aggregation", "attribute mapping", "scalability", "schema", "data consistency", "testing", "aggregation", "connector"], "s": "App onboarding"}, {"n": 31, "q": "Have you configured extended attributes during application onboarding?", "a": "During the application onboarding process for the ERP\nsystem in SAILPOINT IDENTITY IQ, I utilized the\nbuilt-in capabilities of the SAILPOINT IDENTITY IQ\ninterface to configure extended attributes. The need to use\nextended attributes arose due to the unique nature of the\nERP system which had specific data fields that weren't\npart of SAILPOINT IDENTITY IQ's default attribute set.\n1. For example, Application Definition: After initiating the\napplication onboarding process via SAILPOINT\nIDENTITY IQ's UI, I began by defining the basics of the\nERP system, such as its type, connection details, and\nprimary attributes.\n2. And, Adding Extended Attributes: Upon reaching the\nattribute configuration section, I identified the need for\nextended attributes. Using the UI's \"Add Attribute\"\nfunctionality, I introduced these bespoke attributes\nrelevant to our ERP system. Each attribute was defined\nwith its name, data type, and other relevant specifications.\n3. Then, Mapping ERP Data to Extended Attributes: Post\nattribute definition, I mapped data fields from the ERP\nsystem to the extended attributes I had created. This\nensured that during the data synchronization process,\nspecific ERP fields would correlate correctly with their\nrespective extended attributes in SAILPOINT IDENTITY\nIQ.\n4. Of course, Testing the Configuration: After setting up the\nextended attributes and completing other necessary\nconfigurations, I executed a test aggregation. This ensured\nthat data from the ERP system flowed into SAILPOINT\nIDENTITY IQ correctly and that the extended attributes\npopulated as expected.\n5. And at the end, Finalizing the Onboarding Process: With\nthe extended attributes tested and working correctly, I\nproceeded with other stages of the application onboarding,\nsuch as setting up lifecycle events, entitlements, and\npolicies.\nBy using SAILPOINT IDENTITY IQ's UI for this task, I\nmanaged to bypass direct XML editing, which made the\nprocess more intuitive and less error prone, especially\ngiven the comprehensive nature of our ERP system.", "k": ["extended attribute", "XML import", "correlation", "lifecycle event", "testing", "aggregation", "entitlement"], "s": "App onboarding"}, {"n": 32, "q": "Business Role vs IT role — what is the difference?", "a": "The relationship among these roles is hierarchical. A\nBusiness Role may contain multiple IT Roles, and each\nIT Role could comprise multiple entitlements. This\nhierarchical structure allows for a more organized and\nmanageable way to control access rights within an\norganization. It simplifies the process of granting,\nupdating, and revoking access privileges and helps ensure\ncompliance by providing visibility into who has access to\nwhat within the organization.", "k": ["IT role", "business role", "entitlement", "deprovisioning", "compliance", "role"], "s": "App onboarding"}, {"n": 33, "q": "Business and IT role mining Configuration? What is it used for?", "a": "What is it used for?\nRole mining in SAILPOINT IDENTITY IQ refers to the\nprocess of discovering roles within an organization based\non patterns of user access. It's a crucial step in building a\nrole-based access control model and can significantly\nstreamline identity and access management. Role mining\nin SAILPOINT IDENTITY IQ is divided into two\ncategories: Business Role Mining and IT Role Mining.\n● Business Role Mining: The aim of business role mining is\nto uncover roles that reflect the functional structure of the\norganization, such as job titles, departments, or geographic\nlocations.\no For example, \"Sales Manager\" or \"Finance Analyst\".\nThese roles are often directly linked to the HR systems.\nBusiness roles help group users who share similar\nresponsibilities and require similar types of access.\n● IT Role Mining: IT role mining, on the other hand, aims\nto uncover roles that encapsulate sets of system\nentitlements. These IT roles are usually based on technical\nconsiderations, such as the need for certain users to have\naccess to specific systems or applications.\no For example, \"SAP Administrator\" or \"Database\nManager\". IT roles help to group system specific\npermissions that are often assigned to users based on their\ntechnical responsibilities or requirements.\nThe Configuration of Business and IT role mining in\nSAILPOINT IDENTITY IQ involves a combination of\nautomated algorithms and manual review. The system can\nsuggest potential roles based on patterns of user access,\nbut these suggestions usually need to be reviewed and\nvalidated by subject matter experts within the\norganization.\nRole mining is important as it helps organizations better\nmanage user access and improve security. By grouping\nusers into roles, organizations can more efficiently\nmanage access rights, simplify access requests and\nreviews, and ensure compliance with regulatory\nrequirements.\nMoreover, it can also help uncover excessive or\ninappropriate access rights that could pose a security risk.", "k": ["role mining", "IT role", "business role", "SAP", "RBAC", "access request", "HR system", "entitlement"], "s": "App onboarding"}, {"n": 34, "q": "Have you written custom rules?", "a": "I wrote custom rules many times, since they give\norganizations the freedom to customize how the whole\nidentity governance platform works to fit their unique\nbusiness needs.\nExample:\nIn a past project, I used a Manager Lookup Rule in\nSAILPOINT IDENTITY IQ to establish the relationship\nbetween an identity and their respective manager. This\nprocess was essential to accurately depict the\norganizational hierarchy within the system, playing a vital\nrole in operations such as access request approvals and\naccess certifications.\nIn the context of that project, I utilized BeanShell\nscripting language to implement a basic Manager Lookup\nRule in SAILPOINT IDENTITY IQ. The rule operated as\nfollows:\n```java import sailpoint.object.*; import sailpoint.tools.*;\nIdentity manager = null;\ntry {\n// Get the manager's employee ID from the identity\nattributes\nString managerEmployeeId = (String)\nidentity.getAttribute(\"managerId\"); if\n(managerEmployeeId != null) {\n// Query the Identity class to find the manager's Identity\nobject based on their employee\nID\nFilter filter = Filter.eq(\"employeeId\",\nmanagerEmployeeId);\nQueryOptions qo = new QueryOptions(); qo.add(filter);\nmanager = context.getObject(Identity.class, qo); }\n} catch (GeneralException e) { e.printStackTrace();\n}\nreturn manager;\n```\nThis script utilized the `managerId` attribute (representing\nthe manager's employee ID) from the identity to search\nfor the corresponding manager's Identity object within\nSAILPOINT IDENTITY IQ. The rule would then return\nthis Identity object, effectively establishing the link\nbetween the identity and their manager.\nThis rule was typically activated during the identity\naggregation process. Therefore, every time new data was\nimported from the connected systems, the identities were\nappropriately linked to their respective managers.\nCode Explanation:\nFirst, I declared an Identity object named manager and\ninitialized it to null. This Identity object was intended to\nhold the Identity object of the manager once it was\nretrieved.\nNext, inside a trycatch block to handle any potential\nexceptions, I began the process of fetching the manager's\nidentity.\nI retrieved the manager's employee ID from the identity\nobject's attributes. In SAILPOINT IDENTITY IQ, an\nidentity object often has several attributes, and in this\ncase, the attribute managerId was assumed to contain the\nemployee ID of the manager.\nIf the manager's employee ID was not null, I constructed\na filter to query the Identity class in SAILPOINT\nIDENTITY IQ. The filter was based on the employeeId\nattribute of the Identity object, which I expected to match\nthe manager's employee ID retrieved earlier.\nNext, I created a QueryOptions object and added the filter\nto it. I then used the context object to execute the query\nagainst the Identity class with the query options. The\ncontext object in SAILPOINT IDENTITY IQ provides\nmethods to interact with the data stored in SAILPOINT\nIDENTITY IQ, such as fetching, updating, or deleting\nobjects.\nIn case of any GeneralException, the catch block was\ndesigned to handle it by printing the stack trace. This\napproach helped in debugging, as it would print details\nabout any exceptions that occurred.\nFinally, I returned the manager object. If the manager's\nIdentity object was successfully fetched, it would contain\nthat object; otherwise, it would remain null", "k": ["context.search", "Java", "context object", "error handling", "BeanShell", "custom rule", "approval", "logs"], "s": "App onboarding"}, {"n": 35, "q": "Could you share an example where a custom rule significantly improved the onboarding process?", "a": "Sure, here's an example from a project I was involved in:\nThe organization I was working with had many users that\nneeded to be onboarded into SAILPOINT IDENTITY IQ.\nThese users were spread across several different\ndepartments and each department had its own unique set\nof access rights that needed to be granted.\nThe default onboarding process in SAILPOINT\nIDENTITY IQ would have required manually assigning\neach user to the appropriate roles after they were\nonboarded. Given the large number of users, this would\nhave been a time consuming and error prone process.\nTo streamline this, I wrote a custom rule that\nautomatically assigned the appropriate roles to users\nbased on their department as part of the onboarding\nprocess. The rule utilized the department attribute of the\nusers being onboarded, matched it against a predefined\nmapping of departments to roles, and automatically\nassigned the corresponding roles to the user.\nThis significantly improved the efficiency of the\nonboarding process, eliminating the need for manual role\nassignment and reducing the chance of errors. It also\nensured that users had the correct access rights from the\nmoment they were onboarded, improving their initial\nexperience with the system.", "k": ["custom rule", "role", "onboarded", "department", "assigned"], "s": "App onboarding"}, {"n": 36, "q": "What is the most important task that needs to be running in SAILPOINT IDENTITY IQ?", "a": "To the best of my knowledge, there are two primary tasks\nin SAILPOINT IDENTITY IQ: Account Aggregation and\nIdentity Cube Refresh. This is because SAILPOINT\nIDENTITY IQ is primarily built around and dependent on\nAccounts and Identity. Additionally, there are out of the\nbox maintenance tasks responsible for clearing RAM and\ncache, which subsequently boost the performance of the\nSAILPOINT IDENTITY IQ servers.\nThe Identity Refresh or Aggregation task in SailPoint\nIdentityIQ (SAILPOINT IDENTITY IQ) is key for\nmaintaining the system's UpToDate understanding of user\nidentities across all connected resources. It comprises two\nkey steps:\n1. Application Aggregation: Fetches data from all\nconnected systems like Active Directory, SAP, etc.,\nbringing identity and account details into SAILPOINT\nIDENTITY IQ.\n2. Identity Cube Refresh: Consolidates the fetched data\nfrom different applications to create a unified identity for\neach user, reflected in SAILPOINT IDENTITY IQ's\nIdentity Cube.\nRegular execution of this task, usually scheduled daily or\nweekly, is crucial to maintain current data, support\naccurate access certifications, enforce policies, manage\naccess requests, and provision resources. Failing to run or\nerrors in this task can lead to data inconsistencies,\npotential security violations, and inaccurate reporting", "k": ["identity cube", "SAP", "data consistency", "performance", "Active Directory", "access request", "aggregation", "certification"], "s": "App onboarding"}, {"n": 37, "q": "How do you ensure the reliability and accuracy of the identity aggregation process?", "a": "In my previous role, to ensure the reliability and accuracy\nof the identity aggregation process in SAILPOINT\nIDENTITY IQ, I diligently practiced several key\nprocedures:\n● I consistently validated Data Sources, making sure the data\nin the connected systems was accurate, updated, and clean\nbefore aggregation, which helped create precise Identity\nCubes in SAILPOINT IDENTITY IQ.\n● I ensured Proper Connector Configuration, configuring\nconnectors accurately to fetch data correctly from various\nresources. Each connected system had a specific\nconnector, which I tailored to its needs.\n● I handled Appropriate Attribute Mapping, correctly\naligning attributes from connected systems to\ncorresponding SAILPOINT IDENTITY IQ identity\nattributes. This prevented misaligned mapping and the\ncreation of inaccurate Identity Cubes.\n● I set up Regular Scheduling of Aggregation Tasks.\nDepending on the organization's dynamic nature, I\nscheduled these tasks daily or multiple times a day to keep\nSAILPOINT IDENTITY IQ data current.\n● Lastly, I implemented robust Error Handling and Logging\nmechanisms. These captured and logged any issues during\nthe aggregation process, enabling me to resolve them\npromptly.\nThrough these practices, I effectively maintained the\nidentity aggregation process, ensuring that SAILPOINT\nIDENTITY IQ always had an accurate and UpToDate\nunderstanding of all identities in the system.", "k": ["identity cube", "attribute mapping", "error handling", "data integrity", "data consistency", "logs", "customization", "aggregation"], "s": "App onboarding"}, {"n": 38, "q": "How do you handle issues or errors that arise during this process?", "a": "In my previous role, I implemented robust error handling\nand logging mechanisms for the identity aggregation\nprocess in SAILPOINT IDENTITY IQ. This was crucial\nto effectively detect and resolve any issues that occurred\nduring the aggregation process. My work included setting\nup notifications for critical errors, ensuring exceptions\nwere correctly caught and handled, and maintaining\ndetailed log files for troubleshooting and audit purposes.\nThis improved our ability to promptly respond to errors\nand reduced the potential impact on our identity\nmanagement operations.", "k": ["error handling", "logs", "troubleshooting", "aggregation", "compliance", "role"], "s": "App onboarding"}, {"n": 39, "q": "What is a Context Object in a BeanShell?", "a": "In the context of BeanShell scripts in SAILPOINT\nIDENTITY IQ, the context object is a predefined variable\nthat represents an instance of\nsailpoint.api.SailPointContext. This SailPointContext\nobject is essentially a connection to the IdentityIQ\ndatabase.", "k": ["context object", "BeanShell", "web services / REST", "variable", "represents"], "s": "App onboarding"}, {"n": 40, "q": "What is Context.search?", "a": "In the context of SAILPOINT IDENTITY IQ,\nContext.search is a method used to perform a search\nquery on the IdentityIQ data. This is a very powerful tool\nin SAILPOINT IDENTITY IQ as it allows you to fetch\ndata from the IdentityIQ database based on the specific\ncriteria defined in the search query.\nThis method is part of the Context object, which is a\ncentral object in SAILPOINT IDENTITY IQ that\nprovides several methods for interacting with IdentityIQ\ndata, such as creating, updating, deleting, and fetching\nobjects.\nHere's a brief explanation of how Context.search works:\nInput Parameters: The Context.search method typically\naccepts two parameters: the class of the objects you want\nto search for, and a QueryOptions object that defines the\nsearch criteria.\n● Search Criteria: The search criteria are defined using a\nQueryOptions object. This object can contain several\nfilters that specify the conditions that the returned objects\nmust meet.\n● Return Value: The Context.search method returns a List\nof objects that match the\nsearch criteria. Each object in the list is an instance of the\nclass specified as the first parameter.", "k": ["context.search", "context object", "Entra / Azure AD", "criteria", "method"], "s": "App onboarding"}, {"n": 41, "q": "What is a debug screen and how is it used?", "a": "The debug screen in SAILPOINT IDENTITY IQ is a\nbuilt-in tool used for real time troubleshooting and\nanalysis of SAILPOINT IDENTITY IQ's features, tasks,\nand data. It allows administrators and developers to\nexecute raw SQL queries, BeanShell scripts, or XML\nimports/exports to interact with the SAILPOINT\nIDENTITY IQ database and components directly. The\ndebug screen provides critical insights during\ndevelopment or problem solving, but due to its powerful\nand direct access, it should be used cautiously and\nresponsibly to prevent unintended alterations or exposure\nof sensitive data.", "k": ["XML import", "debug page", "BeanShell", "troubleshooting"], "s": "App onboarding"}, {"n": 42, "q": "How do you import XML files to SAILPOINT IDENTITY IQ?", "a": "In SAILPOINT IDENTITY IQ, importing XML files is\npart of the data import process. This is typically done\nthrough the SAILPOINT IDENTITY IQ UI or command\nline. The XML file, which contains structured data (like\nuser profiles or entitlements), is first prepared according\nto SAILPOINT IDENTITY IQ's schema. Then, using\nSAILPOINT IDENTITY IQ's import functionality, the\nXML file is uploaded, and the contained data is parsed,\nvalidated, and imported into SAILPOINT IDENTITY\nIQ's database. This process is crucial for populating\nSAILPOINT IDENTITY IQ with necessary data for\nidentity management.", "k": ["XML import", "schema", "performance", "entitlement"], "s": "App onboarding"}, {"n": 43, "q": "What is the difference between role and entitlement in SailPoint?", "a": "In SAILPOINT IDENTITY IQ, an entitlement is a\ngranular level of access within a system, often tied to a\nspecific action or set of actions a user can perform within\nan application. For example, 'Read Access' or 'Admin\nPrivileges' in an application are entitlements.\nA role, on the other hand, is a collection of such\nentitlements meant to reflect a certain job function or\nresponsibility within the organization. Roles simplify the\nprocess of access management by grouping together\nrelated entitlements. For instance, a 'Finance Manager'\nrole may include entitlements to several different systems\nrequired to perform the job.\nThus, a role represents a higher level, more abstract\nconcept, while entitlements are the specific, lower- level\npermissions that make up a role. This hierarchy simplifies\nthe process of granting, managing, and auditing access\nrights in an organization", "k": ["entitlement", "role", "level", "perform", "thus"], "s": "App onboarding"}, {"n": 44, "q": "Have you configured or created any custom quick links?", "a": "In SAILPOINT IDENTITY IQ, quick links are frequently\nused links displayed on the dashboard for easy access.\nThey provide a way for users to access common functions\ndirectly from the dashboard, saving time by eliminating\nthe need to navigate through multiple screens.\nOne of the most used quick links in SAILPOINT\nIDENTITY IQ is the Request Access quick link. This link\nprovides a shortcut for users to request access to different\napplications, entitlements, or roles within the\norganization.\nHere's an example:\n1. One of them is: Requesting Application Access:\nLet's say a user needs access to a new application, for\nexample, Salesforce. Rather than navigating through\nmultiple screens to request access, the user can click on\nthe Request Access quick link, select \"Application\nAccess\", and then choose Salesforce from the list of\navailable applications.\nAfter selecting Salesforce, the user will be presented with\na form where they can specify the details of their request,\nsuch as the reason for requesting access and the duration\nof the access needed. The user then submits the request,\nwhich will be sent to the relevant approvers for review.\n2. Another one is a Requesting Role Access:\nSimilarly, a user might need to request access to a\nspecific role, such as Project Manager. Again, they can\nclick on the Request Access quick link, but this time they\nwould choose \"Role Access\" and then select the Project\nManager role from the list of available roles.\nThose are very commonly used for the users that’s why\nits always has to be displayed on a Sailpoint dashboard.\nAs with the application access request, the user will need\nto fill out a form specifying the details of their request\nand submit it for review.\nThe Request Access quick link in SAILPOINT\nIDENTITY IQ simplifies the access request process by\nmaking it easy for users to request the access they need\ndirectly from their dashboard.", "k": ["quick link", "Salesforce", "approval", "access request", "entitlement", "role"], "s": "App onboarding"}, {"n": 45, "q": "What can you tell me about your understanding of custom workflows?", "a": "Custom workflows in SAILPOINT IDENTITY IQ are a\npowerful way to automate and customize business\nprocesses within your organization's identity management\nstrategy. Workflows in SAILPOINT IDENTITY IQ are\nessentially a series of steps that can be used to automate\nprocesses such as user provisioning, access request\napprovals, password resets, and more.\nA custom workflow in SAILPOINT IDENTITY IQ is\ncreated using the built-in Workflow Designer, a graphical\ntool that allows you to visually construct and modify\nworkflows. It provides a wide array of prebuilt elements\n(like Approval, Email, Form, etc.) that can be dragged\nand dropped onto a canvas to design the flow of the\nprocess. You can also write your own custom logic using\nBeanShell scripting.", "k": ["architect vs developer", "BeanShell", "approval", "access request", "customization", "workflow", "provisioning"], "s": "App onboarding"}, {"n": 46, "q": "Can you give an example of a custom workflow you've created and the problem it has solved?", "a": "I recall designing a simple access request approval\nworkflow using SAILPOINT IDENTITY IQ. When an\nemployee submitted a request for access to a specific\nsystem, I didn't have to manually send the request to their\nmanager. Instead, I programmed a custom workflow that\nautomatically routed this request to the appropriate\nmanager. Upon approval, the workflow was designed to\nactivate the provisioning process, granting the employee\ntheir requested access. If the manager rejected the\nrequest, the workflow automatically triggered an email\nnotification to inform the employee.\nIn addition to automating processes, I also used custom\nworkflows for performing checks, validations, and\nensuring adherence to company policies. For instance, I\nbuilt a workflow designed to verify that the granting of\nspecific access wouldn't violate our segregation of duties\npolicies before moving forward with the approval\nprocess.\nSAILPOINT CERTIFICATION", "k": ["segregation of duties", "approval", "access request", "workflow", "certification", "provisioning"], "s": "App onboarding"}, {"n": 47, "q": "Have you worked on Certification or Access Reviews?", "a": "Certainly, when managing the complexities of large-scale\naccess reviews, I leverage the power of SAILPOINT\nIDENTITY IQ's certification and access review module.\nI had identified a set of high-risk entitlements in “XYZ”\nCompany that granted substantial access across various\ncritical systems. These entitlements could have\npotentially led to major security risks if they had fallen\ninto the wrong hands. That’s why we have to do by\nweekly, monthly, quarterly and yearly certifications or\naccess reviews in order to make sure that everybody is\nstill have a proper access to do their job.\nI needed to conduct frequent reviews of these high-risk\nentitlements to ensure that only the appropriate\nindividuals possessed them, without having to launch a\nfull certification campaign each time.", "k": ["campaign", "scalability", "entitlement", "certification"], "s": "Certification"}, {"n": 48, "q": "Have you set up a custom Certification or Access Review workflow?", "a": "I implemented a targeted access review in SAILPOINT\nIDENTITY IQ, focusing on these high-risk entitlements.\nI can walk through the Workflow Details:\n● First, I identified and defined the high-risk entitlements in\nIIQ. This included access to critical systems, superuser\nrights, admin rights, and more.\n● Utilizing IIQ's Access Review functionality, I set up a\nnew review that targeted only the high-risk entitlements.\n● I assigned this review to the appropriate managers or role\nowners. Their responsibility was to certify whether the\nusers with these high-risk entitlements still required them.\n● The assigned reviewers went through the list of users with\nhigh-risk entitlements, verifying the necessity for each\nuser to have this level of access. They could approve the\naccess if it was necessary or revoke it if it was no longer\nneeded.\n● Based on the review, IIQ either maintained the user's\naccess or initiated a deprovisioning process to revoke the\nhigh-risk entitlements from users who no longer required\nthem. This process greatly improved the security of our\norganization's critical systems.", "k": ["privileged access", "reviewer", "approval", "workflow", "entitlement", "certification", "deprovisioning", "provisioning"], "s": "Certification"}, {"n": 49, "q": "What is Segregation of Duties (SoD)?", "a": "Segregation of Duties (SoD) is a concept in security and\ncompliance that is designed to prevent fraud and error by\nensuring that at least two individuals are responsible for\nseparate parts of any high-risk task. SoD works by\nbreaking down tasks that could potentially be fraudulent\nif performed by one person alone, into multiple parts so\nthat it would require
